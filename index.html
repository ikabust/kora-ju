<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9a7165">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<title>推しスクショ A4プリンター</title>

<style>
:root{
 --brown:#8f675b;
 --dark:#745247;
 --bg:#f7f3f0;
 --line:#dfd4cf;
 --text:#4d403b
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif
}

header{
 padding:18px 20px;
 background:var(--brown);
 color:#fff
}

header h1{
 margin:0;
 font-size:20px
}

header p{
 margin:5px 0 0;
 font-size:12px;
 opacity:.9
}

.controls,
.settings{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 padding:12px 15px;
 background:#fff;
 border-bottom:1px solid var(--line)
}

.settings{
 gap:14px;
 background:#fffaf7
}

button,
.file-label{
 border:0;
 border-radius:10px;
 padding:10px 14px;
 background:var(--brown);
 color:#fff;
 font-size:14px;
 cursor:pointer;
 font-family:inherit
}

button:hover,
.file-label:hover{
 background:var(--dark)
}

#deleteModeButton.active{
 background:#b94b4b
}

#clearButton{
 background:#8b6d65
}

input[type=file]{
 display:none
}

.file-label{
 display:inline-flex;
 align-items:center;
 justify-content:center
}

.setting{
 display:flex;
 align-items:center;
 gap:6px;
 font-size:13px
}

.setting input{
 width:65px;
 padding:6px 7px;
 border:1px solid var(--line);
 border-radius:7px;
 font-size:14px
}

.info{
 padding:10px 15px;
 font-size:13px
}

.save-status{
 padding:0 15px 10px;
 font-size:12px;
 color:#8a7168
}

.delete-mode-message{
 display:none;
 margin:0 15px 12px;
 padding:10px 12px;
 border-radius:9px;
 background:#fff0f0;
 color:#a23e3e;
 font-size:13px
}

.delete-mode-message.show{
 display:block
}

#preview{
 padding:20px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:20px
}

.page-wrap{
 position:relative;
 flex:0 0 auto;
 overflow:visible
}

.page{
 position:absolute;
 left:0;
 top:0;

 /* A4縦 */
 width:210mm;
 height:297mm;

 transform-origin:top left;
 background:#fff;
 box-shadow:0 2px 10px rgba(0,0,0,.12);
 overflow:hidden
}

.item{
 position:absolute;
 background:#fff;
 cursor:grab;
 user-select:none
}

.item:active{
 cursor:grabbing
}

.item.drag-over{
 outline:3px solid #9a7165;
 outline-offset:2px
}

.item img{
 display:block;
 object-fit:fill;
 pointer-events:none
}

.rotate-button{
 position:absolute;
 top:4px;
 right:4px;
 z-index:5;
 width:28px;
 height:28px;
 padding:0;
 border-radius:50%;
 border:1px solid rgba(255,255,255,.9);
 background:rgba(80,55,48,.78);
 color:#fff;
 font-size:17px;
 line-height:28px;
 text-align:center
}

.delete-mark{
 position:absolute;
 top:4px;
 left:4px;
 z-index:6;
 width:28px;
 height:28px;
 border-radius:50%;
 background:#c74747;
 color:#fff;
 font-size:20px;
 line-height:26px;
 text-align:center;
 pointer-events:none
}

body.delete-mode .item{
 cursor:pointer;
 outline:2px dashed rgba(199,71,71,.65);
 outline-offset:-2px
}

body.delete-mode .rotate-button{
 display:none
}

.empty{
 padding:50px 20px;
 text-align:center;
 color:#9b8981;
 font-size:14px
}


/* 印刷はA4縦 */
@media print{

 @page{
  size:A4 portrait;
  margin:0
 }

 html,
 body{
  margin:0;
  padding:0;
  background:#fff
 }

 header,
 .controls,
 .settings,
 .info,
 .save-status,
 .delete-mode-message{
  display:none!important
 }

 #preview{
  display:block;
  padding:0
 }

 .page-wrap{
  width:210mm!important;
  height:297mm!important;
  margin:0;
  page-break-after:always;
  break-after:page
 }

 .page{
  width:210mm;
  height:297mm;
  transform:none!important;
  margin:0;
  box-shadow:none
 }

 .rotate-button,
 .delete-mark{
  display:none!important
 }
}
</style>
</head>


<body>

<header>
 <h1>📸 推しスクショ A4プリンター</h1>
 <p>
  スクショを追加すると、自動でA4に並べます　
  <span style="opacity:.75">v1.4.0</span>
 </p>
</header>


<div class="controls">

 <label class="file-label">
  📷 画像を追加
  <input
   id="fileInput"
   type="file"
   accept="image/*"
   multiple
  >
 </label>

 <button id="deleteModeButton">
  🗑️ 削除モード
 </button>

 <button id="clearButton">
  🗑️ 全部削除
 </button>

 <button id="pdfButton">
  📄 PDFに保存 / 印刷
 </button>

</div>


<div class="settings">

 <div class="setting">
  <label for="widthInput">画像の横幅</label>
  <input
   id="widthInput"
   type="number"
   min="1"
   step="0.1"
   value="4.5"
  >
  cm
 </div>

 <div class="setting">
  <label for="gapInput">すき間</label>
  <input
   id="gapInput"
   type="number"
   min="0"
   step="0.1"
   value="0.3"
  >
  cm
 </div>

 <div class="setting">
  <label for="marginInput">余白</label>
  <input
   id="marginInput"
   type="number"
   min="0"
   step="0.1"
   value="0.5"
  >
  cm
 </div>

</div>


<div id="info" class="info"></div>

<div id="saveStatus" class="save-status"></div>

<div
 id="deleteModeMessage"
 class="delete-mode-message"
>
 🗑️ 削除モード中：消したい画像をクリックしてください
</div>

<div id="preview">
 <div class="empty">
  📷 画像を追加すると、ここにA4レイアウトが表示されます
 </div>
</div>


<script>

const DB_NAME="oshiScreenshotPrinter";
const DB_VERSION=4;
const STORE_NAME="images";

/* A4縦 */
const A4_WIDTH=210;
const A4_HEIGHT=297;


const fileInput=document.getElementById("fileInput");
const preview=document.getElementById("preview");

const info=document.getElementById("info");
const saveStatus=document.getElementById("saveStatus");

const pdfButton=document.getElementById("pdfButton");
const deleteModeButton=document.getElementById("deleteModeButton");
const clearButton=document.getElementById("clearButton");

const widthInput=document.getElementById("widthInput");
const gapInput=document.getElementById("gapInput");
const marginInput=document.getElementById("marginInput");

const deleteModeMessage=document.getElementById("deleteModeMessage");


let db=null;
let images=[];
let deleteMode=false;


/* =========================
   IndexedDB
========================= */

function openDatabase(){

 return new Promise((resolve,reject)=>{

  const r=indexedDB.open(DB_NAME,DB_VERSION);

  r.onupgradeneeded=e=>{

   const d=e.target.result;

   if(!d.objectStoreNames.contains(STORE_NAME)){

    d.createObjectStore(
     STORE_NAME,
     {
      keyPath:"id",
      autoIncrement:true
     }
    );

   }

  };

  r.onsuccess=e=>{
   db=e.target.result;
   resolve(db);
  };

  r.onerror=e=>{
   reject(e.target.error);
  };

 });

}


function getAllImages(){

 return new Promise((resolve,reject)=>{

  const r=
   db
   .transaction(STORE_NAME,"readonly")
   .objectStore(STORE_NAME)
   .getAll();

  r.onsuccess=()=>{

   const a=r.result||[];

   a.sort(
    (x,y)=>
     (typeof x.order==="number"?x.order:x.id)
     -
     (typeof y.order==="number"?y.order:y.id)
   );

   resolve(a);

  };

  r.onerror=e=>{
   reject(e.target.error);
  };

 });

}


/* =========================
   画像サイズ取得
========================= */

function getImageRatio(blob){

 return new Promise((resolve,reject)=>{

  const u=URL.createObjectURL(blob);
  const im=new Image();

  im.onload=()=>{

   const r=
    im.naturalWidth /
    im.naturalHeight;

   URL.revokeObjectURL(u);

   resolve(r);

  };

  im.onerror=()=>{

   URL.revokeObjectURL(u);

   reject(
    new Error("画像を読み込めませんでした")
   );

  };

  im.src=u;

 });

}


/* =========================
   画像保存
========================= */

async function saveImage(blob,name){

 const ratio=await getImageRatio(blob);

 /*
   横長 → 90°右回転
   縦長 → 0°
 */
 const rotation=
  ratio>1
   ?90
   :0;

 return new Promise((resolve,reject)=>{

  const s=
   db
   .transaction(STORE_NAME,"readwrite")
   .objectStore(STORE_NAME);

  const r=s.add({

   blob,
   name,
   created:Date.now(),

   order:
    Date.now()+
    Math.random(),

   rotation

  });

  r.onsuccess=()=>{
   resolve(r.result);
  };

  r.onerror=e=>{
   reject(e.target.error);
  };

 });

}


function putImage(image){

 return new Promise((resolve,reject)=>{

  const t=
   db.transaction(
    STORE_NAME,
    "readwrite"
   );

  t.objectStore(STORE_NAME)
   .put(image);

  t.oncomplete=resolve;

  t.onerror=e=>{
   reject(e.target.error);
  };

 });

}


function deleteImage(id){

 return new Promise((resolve,reject)=>{

  const t=
   db.transaction(
    STORE_NAME,
    "readwrite"
   );

  const r=
   t.objectStore(STORE_NAME)
    .delete(id);

  r.onsuccess=resolve;

  r.onerror=e=>{
   reject(e.target.error);
  };

 });

}


function clearDatabase(){

 return new Promise((resolve,reject)=>{

  const t=
   db.transaction(
    STORE_NAME,
    "readwrite"
   );

  const r=
   t.objectStore(STORE_NAME)
    .clear();

  r.onsuccess=resolve;

  r.onerror=e=>{
   reject(e.target.error);
  };

 });

}


function saveOrder(){

 return new Promise((resolve,reject)=>{

  const t=
   db.transaction(
    STORE_NAME,
    "readwrite"
   );

  const s=
   t.objectStore(STORE_NAME);

  images.forEach((im,i)=>{

   im.order=i;

   s.put(im);

  });

  t.oncomplete=resolve;

  t.onerror=e=>{
   reject(e.target.error);
  };

 });

}


/* =========================
   スマホ表示用縮小
========================= */

function fitPagesToScreen(){

 const wraps=
  preview.querySelectorAll(
   ".page-wrap"
  );

 if(!wraps.length)return;

 const available=
  Math.max(
   1,
   preview.clientWidth-40
  );

 wraps.forEach(w=>{

  const p=
   w.querySelector(".page");

  if(!p)return;

  p.style.transform="scale(1)";

  const pw=p.offsetWidth;
  const ph=p.offsetHeight;

  const scale=
   Math.min(
    1,
    available/pw
   );

  p.style.transform=
   `scale(${scale})`;

  w.style.width=
   `${pw*scale}px`;

  w.style.height=
   `${ph*scale}px`;

 });

}


/* =========================
   画像比率をキャッシュ
========================= */

async function prepareRatios(){

 const jobs=
  images.map(
   async im=>{

    if(!im._ratio){

     im._ratio=
      await getImageRatio(
       im.blob
      );

    }

    return im;

   }
  );

 await Promise.all(jobs);

}


/* =========================
   A4レイアウト作成
========================= */

async function buildLayout(){

 if(!images.length){

  preview.innerHTML=
   '<div class="empty">' +
   '📷 画像を追加すると、ここにA4レイアウトが表示されます' +
   '</div>';

  info.textContent="";

  return;

 }

 await prepareRatios();


 const width=
  Math.max(
   1,
   parseFloat(widthInput.value)||4.5
  )*10;

 const gap=
  Math.max(
   0,
   parseFloat(gapInput.value)||0.3
  )*10;

 const margin=
  Math.max(
   0,
   parseFloat(marginInput.value)||0.5
  )*10;

 const usableW=
  A4_WIDTH-
  margin*2;

 const usableH=
  A4_HEIGHT-
  margin*2;


 const pages=[];

 let pageItems=[];

 let x=margin;
 let y=margin;


 /*
   左列から下へ。
   下まで来たら右の列へ。
 */

 for(const im of images){

  /*
    回転後の縦横比
  */
  const ratio=
   (
    im.rotation===90 ||
    im.rotation===270
   )
   ?1/im._ratio
   :im._ratio;


  let w=width;
  let h=w/ratio;


  /*
    下まで来たら次の列
  */
  if(
   y>margin &&
   y+h>A4_HEIGHT-margin
  ){

   x+=width+gap;
   y=margin;

  }


  /*
    右端まで来たら次のA4
  */
  if(
   x+w>A4_WIDTH-margin
  ){

   pages.push(pageItems);

   pageItems=[];

   x=margin;
   y=margin;

  }


  /*
    高さがA4に収まらない場合のみ縮小
  */
  if(h>usableH){

   h=usableH;

   w=h*ratio;

  }


  pageItems.push({

   image:im,

   left:x,
   top:y,

   width:w,
   height:h

  });


  y+=h+gap;

 }


 if(pageItems.length){

  pages.push(pageItems);

 }


 renderPages(pages);

}


/* =========================
   ページ描画
========================= */

function renderPages(pages){

 preview.innerHTML="";


 pages.forEach(items=>{

  const wrap=
   document.createElement("div");

  wrap.className="page-wrap";


  const page=
   document.createElement("div");

  page.className="page";


  items.forEach(d=>{

   const im=d.image;


   const item=
    document.createElement("div");

   item.className="item";

   item.draggable=
    !deleteMode;


   item.style.left=
    `${d.left}mm`;

   item.style.top=
    `${d.top}mm`;

   item.style.width=
    `${d.width}mm`;

   item.style.height=
    `${d.height}mm`;


   const img=
    document.createElement("img");

   const url=
    URL.createObjectURL(
     im.blob
    );

   img.src=url;

   img.alt=
    im.name||"画像";


   img.style.width=
    `${d.width}mm`;

   img.style.height=
    `${d.height}mm`;

   img.style.position="absolute";

   img.style.left="50%";
   img.style.top="50%";

   img.style.transformOrigin=
    "center";

   img.style.transform=
    `translate(-50%,-50%) rotate(${im.rotation||0}deg)`;


   /* 回転ボタン */

   const rb=
    document.createElement("button");

   rb.className=
    "rotate-button";

   rb.type="button";

   rb.textContent="↻";

   rb.title=
    `回転：${im.rotation||0}°`;


   rb.onclick=
    async e=>{

     e.preventDefault();
     e.stopPropagation();

     if(deleteMode)return;


     im.rotation=
      im.rotation===90
       ?0
       :90;


     try{

      await putImage(im);

      saveStatus.textContent=
       "✓ 回転を保存しました";

      await buildLayout();

     }catch(err){

      console.error(err);

      saveStatus.textContent=
       "⚠ 回転の保存に失敗しました";

     }

    };


   /*
     削除モード
   */

   if(deleteMode){

    const x=
     document.createElement("div");

    x.className=
     "delete-mark";

    x.textContent="×";

    item.appendChild(x);

   }


   item.onclick=
    async e=>{

     if(
      e.target===rb ||
      !deleteMode
     ){
      return;
     }


     try{

      await deleteImage(
       im.id
      );

      images=
       images.filter(
        x=>x.id!==im.id
       );

      await saveOrder();

      saveStatus.textContent=
       "✓ 画像を削除しました";

      await buildLayout();

     }catch(err){

      console.error(err);

      saveStatus.textContent=
       "⚠ 削除に失敗しました";

     }

    };


   item.appendChild(img);

   item.appendChild(rb);

   setupDrag(
    item,
    im
   );

   page.appendChild(item);

  });


  wrap.appendChild(page);

  preview.appendChild(wrap);

 });


 fitPagesToScreen();


 info.textContent=
  `${images.length}枚 / A4 ${pages.length}ページ`;

}


/* =========================
   並び替え
========================= */

function setupDrag(item,target){

 item.ondragstart=e=>{

  if(deleteMode){

   e.preventDefault();

   return;

  }

  e.dataTransfer.effectAllowed=
   "move";

  e.dataTransfer.setData(
   "text/plain",
   String(target.id)
  );

 };


 item.ondragover=e=>{

  if(deleteMode)return;

  e.preventDefault();

  item.classList.add(
   "drag-over"
  );

 };


 item.ondragleave=()=>{

  item.classList.remove(
   "drag-over"
  );

 };


 item.ondrop=async e=>{

  if(deleteMode)return;

  e.preventDefault();

  item.classList.remove(
   "drag-over"
  );


  const id=
   Number(
    e.dataTransfer.getData(
     "text/plain"
    )
   );


  if(
   !id ||
   id===target.id
  ){
   return;
  }


  const from=
   images.findIndex(
    x=>x.id===id
   );

  const to=
   images.findIndex(
    x=>x.id===target.id
   );


  if(
   from<0 ||
   to<0
  ){
   return;
  }


  const [m]=
   images.splice(
    from,
    1
   );


  images.splice(
   to,
   0,
   m
  );


  await saveOrder();

  saveStatus.textContent=
   "✓ 並び順を保存しました";

  await buildLayout();

 };

}


/* =========================
   画像追加
========================= */

fileInput.onchange=
 async e=>{

  const files=
   Array.from(
    e.target.files||[]
   )
   .filter(
    f=>f.type.startsWith("image/")
   );


  if(!files.length)return;


  saveStatus.textContent=
   `画像を保存しています… 0 / ${files.length}`;


  try{

   /*
     途中で再描画しない
   */

   for(
    let i=0;
    i<files.length;
    i++
   ){

    await saveImage(
     files[i],
     files[i].name
    );


    saveStatus.textContent=
     `画像を保存しています… ${i+1} / ${files.length}`;

   }


   fileInput.value="";


   images=
    await getAllImages();


   saveStatus.textContent=
    `✓ ${files.length}枚追加しました`;


   await buildLayout();


  }catch(err){

   console.error(err);

   saveStatus.textContent=
    "⚠ 画像の保存に失敗しました";

  }

 };


/* =========================
   削除モード
========================= */

deleteModeButton.onclick=
 async()=>{

  deleteMode=
   !deleteMode;


  document.body.classList.toggle(
   "delete-mode",
   deleteMode
  );


  deleteModeButton.classList.toggle(
   "active",
   deleteMode
  );


  deleteModeButton.textContent=
   deleteMode
    ? "🗑️ 削除モード終了"
    : "🗑️ 削除モード";


  deleteModeMessage.classList.toggle(
   "show",
   deleteMode
  );


  await buildLayout();

 };


/* =========================
   全削除
========================= */

clearButton.onclick=
 async()=>{

  if(!images.length)return;


  if(
   prompt(
    '全部削除する場合は「削除」と入力してください'
   )!=="削除"
  ){
   return;
  }


  try{

   await clearDatabase();

   images=[];

   saveStatus.textContent=
    "✓ すべて削除しました";

   await buildLayout();


  }catch(err){

   console.error(err);

   saveStatus.textContent=
    "⚠ 削除に失敗しました";

  }

 };


/* =========================
   設定変更
========================= */

[
 widthInput,
 gapInput,
 marginInput
].forEach(
 el=>
  el.addEventListener(
   "change",
   ()=>buildLayout()
  )
);


/* =========================
   印刷
========================= */

pdfButton.onclick=
 async()=>{

  if(!images.length){

   alert(
    "まず画像を追加してください"
   );

   return;

  }


  if(deleteMode){

   deleteMode=false;

   document.body.classList.remove(
    "delete-mode"
   );

   deleteModeButton.classList.remove(
    "active"
   );

   deleteModeButton.textContent=
    "🗑️ 削除モード";

   deleteModeMessage.classList.remove(
    "show"
   );

  }


  await buildLayout();


  setTimeout(
   ()=>window.print(),
   300
  );

 };


/* =========================
   画面サイズ変更
========================= */

window.addEventListener(
 "resize",
 fitPagesToScreen
);


/* =========================
   起動
========================= */

(async()=>{

 try{

  await openDatabase();

  images=
   await getAllImages();


  images.forEach(im=>{

   if(
    typeof im.rotation!=="number"
   ){

    im.rotation=0;

   }

  });


  await buildLayout();


 }catch(err){

  console.error(err);

  info.textContent=
   "データベースを開けませんでした。";

 }

})();

</script>


<script>

/* =========================
   Service Worker
========================= */

if("serviceWorker" in navigator){

 window.addEventListener(
  "load",
  ()=>{

   navigator.serviceWorker
    .register(
     "./sw.js?v=20261001-02",
     {
      updateViaCache:"none"
     }
    )
    .catch(
     err=>
      console.log(
       "Service Worker:",
       err
      )
    );

  }
 );

}

</script>

</body>
</html>
