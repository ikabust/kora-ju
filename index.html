<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3f1;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #8f675b;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

/* =========================
   操作エリア
========================= */

.controls {
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button,
.file-label {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
}

.file-label {
  background: #8f675b;
  color: white;
}

button {
  background: #d8c1b8;
  color: #4d403b;
}

button:hover,
.file-label:hover {
  opacity: 0.8;
}

input[type="file"] {
  display: none;
}

/* =========================
   情報
========================= */

.info {
  padding: 0 18px 15px;
  font-size: 13px;
  color: #786862;
}

/* =========================
   画像一覧
========================= */

#imageList {
  padding: 0 18px 30px;

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(180px, 1fr));

  gap: 16px;
}

/* =========================
   画像カード
========================= */

.image-card {
  position: relative;

  background: white;

  border-radius: 14px;

  padding: 10px;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.08);
}

.image-card img {
  display: block;

  width: 100%;

  max-height: 300px;

  object-fit: contain;

  border-radius: 8px;
}

/* =========================
   削除ボタン
========================= */

.delete-button {
  position: absolute;

  top: 6px;
  right: 6px;

  width: 32px;
  height: 32px;

  padding: 0;

  border-radius: 50%;

  background: rgba(80, 60, 55, 0.85);

  color: white;

  font-size: 18px;

  line-height: 32px;

  text-align: center;
}

.delete-button:hover {
  background: #8f675b;
}

/* =========================
   番号
========================= */

.image-number {
  margin-top: 7px;

  text-align: center;

  font-size: 12px;

  color: #8a7770;
}

/* =========================
   空状態
========================= */

.empty {
  grid-column: 1 / -1;

  text-align: center;

  padding: 60px 20px;

  color: #a08f89;
}

/* =========================
   保存状態
========================= */

.save-status {
  padding: 0 18px 15px;

  font-size: 12px;

  color: #8f675b;
}


/* =====================================================
   印刷用
===================================================== */

@media print {

  body {
    background: white;
  }

  header,
  .controls,
  .info,
  .save-status,
  .image-number,
  .delete-button {
    display: none !important;
  }

  #imageList {
    display: block;

    padding: 0;

    margin: 0;
  }

  .image-card {
    box-shadow: none;

    border-radius: 0;

    padding: 0;

    margin: 0;

    /*
     * 今は画像を1枚ずつPDFへ
     * 元の比率を保って配置
     */
    page-break-after: always;

    break-after: page;
  }

  .image-card:last-child {
    page-break-after: auto;

    break-after: auto;
  }

  .image-card img {
    width: 100%;
    max-height: none;

    object-fit: contain;
  }

  @page {
    size: A4 portrait;
    margin: 10mm;
  }
}
</style>
</head>


<body>

<header>
  <h1>推しスクショ A4プリンター</h1>
  <p>スクショを集めて、あとでA4にまとめよう♡</p>
</header>


<div class="controls">

  <!-- 画像追加 -->

  <label class="file-label">

    📷 スクショを追加

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

  </label>


  <!-- PDF -->

  <button id="pdfButton">
    🖨️ PDF出力
  </button>


  <!-- 全削除 -->

  <button id="clearButton">
    🗑️ 全部削除
  </button>

</div>


<div class="info" id="info">
  画像はまだありません
</div>


<div class="save-status" id="saveStatus">
  準備中…
</div>


<div id="imageList">

  <div class="empty">
    📷<br>
    「スクショを追加」から画像を選んでね
  </div>

</div>


<script>

/* =====================================================
   IndexedDB
===================================================== */

const DB_NAME = "oshiScreenshotPrinter";

const DB_VERSION = 1;

const STORE_NAME = "images";

let db;


/* =====================================================
   IndexedDBを開く
===================================================== */

function openDatabase() {

  return new Promise(function(resolve, reject) {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const database =
          event.target.result;


        if (!database.objectStoreNames.contains(STORE_NAME)) {

          database.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        db = event.target.result;

        resolve(db);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   画像一覧をDBから取得
===================================================== */

function getAllImages() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   画像をDBへ保存
===================================================== */

function saveImage(blob, name) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.add({
        blob: blob,
        name: name,
        created: Date.now()
      });


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   画像をDBから削除
===================================================== */

function deleteImage(id) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.delete(id);


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   全画像削除
===================================================== */

function clearDatabase() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.clear();


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DOM
===================================================== */

const fileInput =
  document.getElementById("fileInput");

const imageList =
  document.getElementById("imageList");

const info =
  document.getElementById("info");

const saveStatus =
  document.getElementById("saveStatus");

const clearButton =
  document.getElementById("clearButton");

const pdfButton =
  document.getElementById("pdfButton");


/* =====================================================
   現在表示している画像
===================================================== */

let images = [];


/* =====================================================
   画像一覧を表示
===================================================== */

function renderImages() {

  imageList.innerHTML = "";


  if (images.length === 0) {

    imageList.innerHTML = `
      <div class="empty">
        📷<br>
        「スクショを追加」から画像を選んでね
      </div>
    `;

    info.textContent =
      "画像はまだありません";

    return;

  }


  info.textContent =
    images.length + "枚の画像";


  images.forEach(
    function(item, index) {

      const card =
        document.createElement("div");

      card.className =
        "image-card";


      /*
       * Blobから一時URLを作る
       */

      const url =
        URL.createObjectURL(
          item.blob
        );


      const img =
        document.createElement("img");

      img.src = url;


      /*
       * 削除
       */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "×";

      deleteButton.title =
        "この画像を削除";


      deleteButton.addEventListener(
        "click",
        async function() {

          const ok =
            confirm(
              "この画像を削除する？"
            );


          if (!ok) {
            return;
          }


          try {

            await deleteImage(item.id);

            URL.revokeObjectURL(url);

            await loadImages();

          } catch(error) {

            console.error(error);

            alert(
              "削除できませんでした"
            );

          }

        }
      );


      /*
       * 番号
       */

      const number =
        document.createElement("div");

      number.className =
        "image-number";

      number.textContent =
        (index + 1) + "枚目";


      card.appendChild(img);

      card.appendChild(
        deleteButton
      );

      card.appendChild(number);


      imageList.appendChild(card);

    }
  );

}


/* =====================================================
   DBから画像を読み込む
===================================================== */

async function loadImages() {

  try {

    images =
      await getAllImages();


    /*
     * 古い順
     */

    images.sort(
      function(a, b) {
        return a.id - b.id;
      }
    );


    renderImages();


    if (images.length > 0) {

      saveStatus.textContent =
        "✓ 自動保存されています";

    } else {

      saveStatus.textContent =
        "画像を追加すると自動保存されます";

    }

  } catch(error) {

    console.error(error);

    saveStatus.textContent =
      "保存データを読み込めませんでした";

  }

}


/* =====================================================
   画像追加
===================================================== */

fileInput.addEventListener(
  "change",
  async function(event) {

    const files =
      Array.from(
        event.target.files
      );


    if (files.length === 0) {
      return;
    }


    saveStatus.textContent =
      "保存中…";


    try {

      for (const file of files) {

        if (
          !file.type.startsWith("image/")
        ) {
          continue;
        }


        /*
         * FileそのものをBlobとして
         * IndexedDBへ保存
         *
         * DataURL化しないので
         * 大きな画像でも比較的安全
         */

        await saveImage(
          file,
          file.name
        );

      }


      await loadImages();


      saveStatus.textContent =
        "✓ 自動保存しました";


    } catch(error) {

      console.error(error);

      saveStatus.textContent =
        "保存に失敗しました";

      alert(
        "画像の保存に失敗しました。\n" +
        "ブラウザの保存領域を確認してみてね。"
      );

    }


    /*
     * 同じ画像を再度選べるようにする
     */

    fileInput.value = "";

  }
);


/* =====================================================
   全削除
===================================================== */

clearButton.addEventListener(
  "click",
  async function() {

    if (images.length === 0) {
      return;
    }


    const ok =
      confirm(
        "保存されている画像を全部削除する？"
      );


    if (!ok) {
      return;
    }


    try {

      await clearDatabase();

      await loadImages();

      saveStatus.textContent =
        "画像をすべて削除しました";

    } catch(error) {

      console.error(error);

      alert(
        "削除できませんでした"
      );

    }

  }
);


/* =====================================================
   PDF出力
===================================================== */

pdfButton.addEventListener(
  "click",
  function() {

    if (images.length === 0) {

      alert(
        "先にスクショを追加してね！"
      );

      return;

    }


    /*
     * ブラウザの印刷画面を開く。
     *
     * 「送信先 → PDFに保存」
     * を選べばPDFとして保存できる。
     *
     * 元画像を再圧縮していないため、
     * 画像の品質をできるだけ維持できる。
     */

    window.print();

  }
);


/* =====================================================
   起動
===================================================== */

(async function() {

  try {

    await openDatabase();

    await loadImages();

  } catch(error) {

    console.error(error);

    saveStatus.textContent =
      "このブラウザでは保存機能を利用できません";

    alert(
      "画像保存機能を開始できませんでした。\n" +
      "Chromeなどの最新版ブラウザで試してみてね。"
    );

  }

})();

</script>

</body>
</html>
