<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3f1;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

header {
  background: #8f675b;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.controls {
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button,
.file-label {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
}

.file-label {
  background: #8f675b;
  color: white;
}

button {
  background: #d8c1b8;
  color: #4d403b;
}

button:hover,
.file-label:hover {
  opacity: 0.8;
}

input[type="file"] {
  display: none;
}

.settings {
  padding: 0 18px 15px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  font-size: 13px;
}

.settings label {
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings input {
  width: 65px;
  padding: 6px;
  border: 1px solid #d8cbc6;
  border-radius: 7px;
}

.info {
  padding: 0 18px 5px;
  font-size: 13px;
  color: #786862;
}

.save-status {
  padding: 0 18px 15px;
  font-size: 12px;
  color: #8f675b;
}

/* =========================
   A4プレビュー
========================= */

#preview {
  padding: 20px;
}

.page {
  position: relative;

  width: 297mm;
  height: 210mm;

  margin: 0 auto 30px;

  background: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.12);

  overflow: hidden;
}

/* =========================
   配置画像
========================= */

.item {
  position: absolute;

  overflow: hidden;

  /*
   * 長押しできることが分かるように
   * 選択を禁止
   */
  user-select: none;
  -webkit-user-select: none;

  cursor: pointer;
}

.item img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;

  pointer-events: none;

  user-select: none;
  -webkit-user-select: none;
}

/* 長押し中 */

.item.long-pressing {
  opacity: 0.55;
  transform: scale(0.96);
}

/* =========================
   印刷
========================= */

@media print {

  body {
    background: white;
  }

  header,
  .controls,
  .settings,
  .info,
  .save-status {
    display: none !important;
  }

  #preview {
    padding: 0;
  }

  .page {
    margin: 0;
    box-shadow: none;

    page-break-after: always;
    break-after: page;
  }

  .page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }
}

/* =========================
   小さい画面
========================= */

@media screen and (max-width: 1000px) {

  .page {
    transform-origin: top left;
    transform: scale(0.65);

    margin-bottom: -70mm;
    margin-left: 0;
  }

}
</style>
</head>


<body>

<header>
  <h1>推しスクショ A4プリンター</h1>
  <p>スクショを選んで、A4にかわいく敷き詰めよう♡</p>
</header>


<div class="controls">

  <label class="file-label">
    📷 スクショを追加

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >
  </label>


  <button id="layoutButton">
    🖼️ A4に敷き詰める
  </button>


  <button id="pdfButton">
    🖨️ PDF出力
  </button>


  <button id="clearButton">
    🗑️ 全部削除
  </button>

</div>


<div class="settings">

  <label>
    基本の高さ
    <input
      id="heightInput"
      type="number"
      value="4.5"
      min="1"
      max="10"
      step="0.1"
    >
    cm
  </label>


  <label>
    画像のすき間
    <input
      id="gapInput"
      type="number"
      value="0.3"
      min="0"
      max="3"
      step="0.1"
    >
    cm
  </label>


  <label>
    A4の余白
    <input
      id="marginInput"
      type="number"
      value="0.5"
      min="0"
      max="3"
      step="0.1"
    >
    cm
  </label>

</div>


<div class="info" id="info">
  画像はまだありません
</div>


<div class="save-status" id="saveStatus">
  読み込み中…
</div>


<div id="preview"></div>


<script>

/* =====================================================
   IndexedDB
===================================================== */

const DB_NAME = "oshiScreenshotPrinter";

const DB_VERSION = 1;

const STORE_NAME = "images";

let db;


/* =====================================================
   DBを開く
===================================================== */

function openDatabase() {

  return new Promise(function(resolve, reject) {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const database =
          event.target.result;


        if (
          !database.objectStoreNames.contains(
            STORE_NAME
          )
        ) {

          database.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        db = event.target.result;

        resolve(db);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DBから全部取得
===================================================== */

function getAllImages() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   画像保存
===================================================== */

function saveImage(blob, name) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.add({
        blob: blob,
        name: name,
        created: Date.now()
      });


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   画像削除
===================================================== */

function deleteImage(id) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.delete(id);


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   全削除
===================================================== */

function clearDatabase() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.clear();


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DOM
===================================================== */

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const info =
  document.getElementById("info");

const saveStatus =
  document.getElementById("saveStatus");

const layoutButton =
  document.getElementById("layoutButton");

const pdfButton =
  document.getElementById("pdfButton");

const clearButton =
  document.getElementById("clearButton");

const heightInput =
  document.getElementById("heightInput");

const gapInput =
  document.getElementById("gapInput");

const marginInput =
  document.getElementById("marginInput");


let images = [];


/* =====================================================
   DBから読み込み
===================================================== */

async function loadImages() {

  images =
    await getAllImages();


  images.sort(
    function(a, b) {
      return a.id - b.id;
    }
  );


  buildLayout();


  if (images.length > 0) {

    saveStatus.textContent =
      "✓ 自動保存されています";

  } else {

    saveStatus.textContent =
      "画像を追加すると自動保存されます";

  }

}


/* =====================================================
   画像追加
===================================================== */

fileInput.addEventListener(
  "change",
  async function(event) {

    const files =
      Array.from(event.target.files);


    if (files.length === 0) {
      return;
    }


    saveStatus.textContent =
      "保存中…";


    try {

      for (const file of files) {

        if (
          !file.type.startsWith("image/")
        ) {
          continue;
        }


        await saveImage(
          file,
          file.name
        );

      }


      await loadImages();


      saveStatus.textContent =
        "✓ 自動保存しました";


    } catch(error) {

      console.error(error);

      alert(
        "画像の保存に失敗しました。"
      );

    }


    /*
     * 同じファイルをもう一度選べるようにする
     */

    fileInput.value = "";

  }
);


/* =====================================================
   A4自動配置
===================================================== */

function buildLayout() {

  preview.innerHTML = "";


  if (images.length === 0) {

    info.textContent =
      "画像はまだありません";

    return;

  }


  /*
   * A4横
   *
   * 297 × 210 mm
   */

  const A4_WIDTH = 297;

  const A4_HEIGHT = 210;


  /*
   * cm → mm
   */

  const targetHeight =
    Number(heightInput.value) * 10;

  const gap =
    Number(gapInput.value) * 10;

  const margin =
    Number(marginInput.value) * 10;


  const usableWidth =
    A4_WIDTH - margin * 2;

  const usableHeight =
    A4_HEIGHT - margin * 2;


  const pages = [];

  let currentPage = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  /*
   * 選択した順番で配置
   */

  for (const image of images) {

    /*
     * 画像を読み込んで
     * 元の縦横比を取得
     */

    const ratio =
      image.blob.type
        ? null
        : null;


    /*
     * ここでは画像そのものから
     * 比率を取得する
     */

    const objectURL =
      URL.createObjectURL(
        image.blob
      );


    /*
     * 同期的にレイアウトするため
     * 一旦デフォルト比率。
     *
     * 実際の比率は画像ロード時に
     * 作り直す。
     */

    currentPage.push({
      image: image,
      src: objectURL
    });

  }


  /*
   * 非同期で実寸を取得
   */

  Promise.all(
    currentPage.map(function(item) {

      return new Promise(function(resolve) {

        const img =
          new Image();


        img.onload =
          function() {

            item.ratio =
              img.naturalWidth /
              img.naturalHeight;


            URL.revokeObjectURL(
              item.src
            );

            resolve();

          };


        img.src = item.src;

      });

    })
  ).then(function() {

    renderPages(
      createLayout(
        currentPage,
        A4_WIDTH,
        A4_HEIGHT,
        targetHeight,
        gap,
        margin,
        usableWidth,
        usableHeight
      )
    );

  });

}


/* =====================================================
   レイアウト計算
===================================================== */

function createLayout(
  source,
  A4_WIDTH,
  A4_HEIGHT,
  targetHeight,
  gap,
  margin,
  usableWidth,
  usableHeight
) {

  const pages = [];

  let page = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  source.forEach(function(item) {

    let h =
      targetHeight;

    let w =
      h * item.ratio;


    /*
     * A4幅より大きい画像だけ
     * 縮小
     */

    if (w > usableWidth) {

      w = usableWidth;

      h = w / item.ratio;

    }


    /*
     * 横に入らなければ
     * 次の段へ
     */

    if (
      x !== margin &&
      x + w > A4_WIDTH - margin
    ) {

      x = margin;

      y += rowHeight + gap;

      rowHeight = 0;

    }


    /*
     * 下に入らなければ
     * 次のページへ
     */

    if (
      y + h > A4_HEIGHT - margin
    ) {

      if (page.length > 0) {

        pages.push(page);

      }


      page = [];

      x = margin;

      y = margin;

      rowHeight = 0;

    }


    page.push({

      image: item.image,

      x: x,
      y: y,

      width: w,
      height: h

    });


    x += w + gap;

    rowHeight =
      Math.max(
        rowHeight,
        h
      );

  });


  if (page.length > 0) {

    pages.push(page);

  }


  return pages;

}


/* =====================================================
   A4ページ描画
===================================================== */

function renderPages(pages) {

  preview.innerHTML = "";


  pages.forEach(function(pageItems) {

    const page =
      document.createElement("div");

    page.className =
      "page";


    pageItems.forEach(function(item) {

      const box =
        document.createElement("div");

      box.className =
        "item";


      box.style.left =
        item.x + "mm";

      box.style.top =
        item.y + "mm";

      box.style.width =
        item.width + "mm";

      box.style.height =
        item.height + "mm";


      const img =
        document.createElement("img");


      const url =
        URL.createObjectURL(
          item.image.blob
        );


      img.src = url;


      box.appendChild(img);

      page.appendChild(box);


      /*
       * 長押し削除
       */

      setupLongPress(
        box,
        item.image
      );

    });


    preview.appendChild(page);

  });


  info.textContent =
    images.length +
    "枚 / " +
    pages.length +
    "ページ";

}


/* =====================================================
   長押し削除
===================================================== */

function setupLongPress(
  element,
  image
) {

  let timer = null;

  let longPressed = false;


  function start() {

    longPressed = false;

    element.classList.add(
      "long-pressing"
    );


    timer =
      setTimeout(
        async function() {

          longPressed = true;

          element.classList.remove(
            "long-pressing"
          );


          const ok =
            confirm(
              "この画像を削除しますか？"
            );


          if (!ok) {
            return;
          }


          try {

            await deleteImage(
              image.id
            );


            await loadImages();


            saveStatus.textContent =
              "画像を削除しました";


          } catch(error) {

            console.error(error);

            alert(
              "削除できませんでした"
            );

          }

        },
        650
      );

  }


  function cancel() {

    if (timer) {

      clearTimeout(timer);

      timer = null;

    }

    element.classList.remove(
      "long-pressing"
    );

  }


  /*
   * PC
   */

  element.addEventListener(
    "mousedown",
    function(event) {

      if (event.button !== 0) {
        return;
      }

      start();

    }
  );


  element.addEventListener(
    "mouseup",
    cancel
  );


  element.addEventListener(
    "mouseleave",
    cancel
  );


  /*
   * スマホ・タブレット
   */

  element.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      start();

    },
    { passive: false }
  );


  element.addEventListener(
    "touchend",
    cancel
  );


  element.addEventListener(
    "touchcancel",
    cancel
  );

}


/* =====================================================
   設定変更
===================================================== */

heightInput.addEventListener(
  "change",
  buildLayout
);

gapInput.addEventListener(
  "change",
  buildLayout
);

marginInput.addEventListener(
  "change",
  buildLayout
);


/* =====================================================
   A4配置ボタン
===================================================== */

layoutButton.addEventListener(
  "click",
  buildLayout
);


/* =====================================================
   PDF
===================================================== */

pdfButton.addEventListener(
  "click",
  function() {

    if (images.length === 0) {

      alert(
        "先にスクショを追加してね！"
      );

      return;

    }


    /*
     * 最新レイアウトを表示してから印刷
     */

    buildLayout();


    setTimeout(
      function() {

        window.print();

      },
      300
    );

  }
);


/* =====================================================
   全削除
===================================================== */

clearButton.addEventListener(
  "click",
  async function() {

    if (images.length === 0) {
      return;
    }


    const ok =
      confirm(
        "保存されている画像を全部削除しますか？"
      );


    if (!ok) {
      return;
    }


    try {

      await clearDatabase();

      await loadImages();

      saveStatus.textContent =
        "画像をすべて削除しました";

    } catch(error) {

      console.error(error);

      alert(
        "削除できませんでした"
      );

    }

  }
);


/* =====================================================
   起動
===================================================== */

(async function() {

  try {

    await openDatabase();

    await loadImages();

  } catch(error) {

    console.error(error);

    saveStatus.textContent =
      "保存機能を開始できませんでした";

  }

})();

</script>

</body>
</html>
