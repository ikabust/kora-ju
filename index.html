<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3f1;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* ヘッダー */

header {
  background: #8f675b;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

/* 操作ボタン */

.controls {
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button,
.file-label {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
}

.file-label {
  background: #8f675b;
  color: white;
}

button {
  background: #d8c1b8;
  color: #4d403b;
}

button:hover,
.file-label:hover {
  opacity: 0.8;
}

input[type="file"] {
  display: none;
}

/* 情報 */

.info {
  padding: 0 18px 15px;
  font-size: 13px;
  color: #786862;
}

/* 画像一覧 */

#imageList {
  padding: 0 18px 30px;

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(180px, 1fr));

  gap: 16px;
}

/* 画像カード */

.image-card {
  position: relative;

  background: white;

  border-radius: 14px;

  padding: 10px;

  box-shadow:
    0 3px 12px rgba(0, 0, 0, 0.08);
}

/* スクショ */

.image-card img {
  display: block;

  width: 100%;

  max-height: 300px;

  object-fit: contain;

  border-radius: 8px;
}

/* 削除ボタン */

.delete-button {
  position: absolute;

  top: 6px;
  right: 6px;

  width: 32px;
  height: 32px;

  padding: 0;

  border-radius: 50%;

  background: rgba(80, 60, 55, 0.85);

  color: white;

  font-size: 18px;

  line-height: 32px;

  text-align: center;
}

.delete-button:hover {
  background: #8f675b;
}

/* 番号 */

.image-number {
  margin-top: 7px;

  text-align: center;

  font-size: 12px;

  color: #8a7770;
}

/* 空っぽ */

.empty {
  grid-column: 1 / -1;

  text-align: center;

  padding: 60px 20px;

  color: #a08f89;
}
</style>
</head>

<body>

<header>
  <h1>推しスクショ A4プリンター</h1>
  <p>まずはスクショを集めるところから♡</p>
</header>


<div class="controls">

  <!-- 画像追加 -->

  <label class="file-label">

    📷 スクショを追加

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

  </label>


  <!-- 全削除 -->

  <button id="clearButton">
    🗑️ 全部削除
  </button>

</div>


<div class="info" id="info">
  画像はまだありません
</div>


<div id="imageList">

  <div class="empty">
    📷<br>
    「スクショを追加」から画像を選んでね
  </div>

</div>


<script>

/* =====================================================
   画像データ
===================================================== */

let images = [];


/* =====================================================
   要素
===================================================== */

const fileInput =
  document.getElementById("fileInput");

const imageList =
  document.getElementById("imageList");

const info =
  document.getElementById("info");

const clearButton =
  document.getElementById("clearButton");


/* =====================================================
   画像追加
===================================================== */

fileInput.addEventListener(
  "change",
  function(event) {

    const files =
      Array.from(event.target.files);


    if (files.length === 0) {
      return;
    }


    files.forEach(function(file) {

      if (!file.type.startsWith("image/")) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          images.push({
            src: e.target.result
          });


          renderImages();

        };


      reader.readAsDataURL(file);

    });


    /*
     * 同じ画像をもう一度選択できるようにする
     */

    fileInput.value = "";

  }
);


/* =====================================================
   画像一覧を表示
===================================================== */

function renderImages() {

  imageList.innerHTML = "";


  /* 画像がない場合 */

  if (images.length === 0) {

    imageList.innerHTML = `
      <div class="empty">
        📷<br>
        「スクショを追加」から画像を選んでね
      </div>
    `;

    info.textContent =
      "画像はまだありません";

    return;

  }


  /* 件数 */

  info.textContent =
    images.length + "枚の画像";


  /* 画像を順番に表示 */

  images.forEach(
    function(image, index) {

      const card =
        document.createElement("div");

      card.className =
        "image-card";


      /* 画像 */

      const img =
        document.createElement("img");

      img.src =
        image.src;


      /* 削除ボタン */

      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete-button";

      deleteButton.textContent =
        "×";


      deleteButton.title =
        "この画像を削除";


      /*
       * この画像だけ削除
       */

      deleteButton.addEventListener(
        "click",
        function() {

          images.splice(index, 1);

          renderImages();

        }
      );


      /* 番号 */

      const number =
        document.createElement("div");

      number.className =
        "image-number";

      number.textContent =
        (index + 1) + "枚目";


      card.appendChild(img);

      card.appendChild(deleteButton);

      card.appendChild(number);


      imageList.appendChild(card);

    }
  );

}


/* =====================================================
   全削除
===================================================== */

clearButton.addEventListener(
  "click",
  function() {

    if (images.length === 0) {
      return;
    }


    const result =
      confirm(
        "全部の画像を削除する？"
      );


    if (!result) {
      return;
    }


    images = [];


    renderImages();

  }
);


/* =====================================================
   初期表示
===================================================== */

renderImages();

</script>

</body>
</html>
