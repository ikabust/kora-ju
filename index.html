<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="theme-color" content="#9a7165">

<title>推しスクショ A4プリンター</title>

<style>
:root{
  --brown:#8f675b;
  --brown-dark:#745247;
  --bg:#f7f3f0;
  --card:#fff;
  --line:#dfd4cf;
  --text:#4d403b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Yu Gothic",
    sans-serif;
}

header{
  padding:18px 20px;
  background:var(--brown);
  color:white;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.9;
}

.controls{
  padding:15px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  background:white;
  border-bottom:1px solid var(--line);
}

button,
.file-label{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:var(--brown);
  color:white;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
}

button:hover,
.file-label:hover{
  background:var(--brown-dark);
}

button:disabled{
  opacity:.5;
  cursor:default;
}

#deleteModeButton.active{
  background:#b94b4b;
}

#clearButton{
  background:#8b6d65;
}

input[type=file]{
  display:none;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.settings{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  padding:12px 15px;
  background:#fffaf7;
  border-bottom:1px solid var(--line);
}

.setting{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
}

.setting input{
  width:65px;
  padding:6px 7px;
  border:1px solid var(--line);
  border-radius:7px;
  font-size:14px;
}

.info{
  padding:10px 15px;
  font-size:13px;
}

.save-status{
  padding:0 15px 10px;
  font-size:12px;
  color:#8a7168;
}

.delete-mode-message{
  display:none;
  margin:0 15px 12px;
  padding:10px 12px;
  border-radius:9px;
  background:#fff0f0;
  color:#a23e3e;
  font-size:13px;
}

.delete-mode-message.show{
  display:block;
}

#preview{
  padding:20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

/* A4 */
.page{
  position:relative;
  width:297mm;
  height:210mm;
  background:white;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  overflow:hidden;
}

/* 画像 */
.item{
  position:absolute;
  background:#fff;
  cursor:grab;
  user-select:none;
}

.item:active{
  cursor:grabbing;
}

.item.drag-over{
  outline:3px solid #9a7165;
  outline-offset:2px;
}

.item img{
  width:100%;
  height:100%;
  object-fit:fill;
  display:block;
  pointer-events:none;
}

/*
  回転ボタン
*/
.rotate-button{
  position:absolute;
  top:4px;
  right:4px;
  z-index:5;

  width:28px;
  height:28px;
  padding:0;

  border-radius:50%;
  border:1px solid rgba(255,255,255,.9);

  background:rgba(80,55,48,.78);
  color:white;

  font-size:17px;
  line-height:28px;
  text-align:center;

  cursor:pointer;

  box-shadow:0 1px 4px rgba(0,0,0,.2);
}

.rotate-button:hover{
  background:rgba(80,55,48,.95);
}

/*
  削除モード
*/
.delete-mark{
  position:absolute;
  top:4px;
  left:4px;
  z-index:6;

  width:28px;
  height:28px;

  border-radius:50%;
  background:#c74747;
  color:white;

  font-size:20px;
  line-height:26px;
  text-align:center;

  pointer-events:none;
}

body.delete-mode .item{
  cursor:pointer;
  outline:2px dashed rgba(199,71,71,.65);
  outline-offset:-2px;
}

body.delete-mode .rotate-button{
  display:none;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#9b8981;
  font-size:14px;
}

/*
  印刷
*/
@media print{

  @page{
    size:A4 landscape;
    margin:0;
  }

  html,
  body{
    margin:0;
    padding:0;
    background:white;
  }

  header,
  .controls,
  .settings,
  .info,
  .save-status,
  .delete-mode-message{
    display:none !important;
  }

  #preview{
    display:block;
    padding:0;
  }

  .page{
    width:297mm;
    height:210mm;

    margin:0;
    box-shadow:none;

    page-break-after:always;
    break-after:page;
  }

  .page:last-child{
    page-break-after:auto;
    break-after:auto;
  }

  .rotate-button,
  .delete-mark{
    display:none !important;
  }
}
</style>
</head>

<body>

<header>
  <h1>📸 推しスクショ A4プリンター</h1>
  <p>スクショを追加すると、自動でA4に並べます</p>
</header>

<div class="controls">

  <label class="file-label">
    📷 画像を追加
    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >
  </label>

  <button id="deleteModeButton">
    🗑️ 削除モード
  </button>

  <button id="clearButton">
    🗑️ 全部削除
  </button>

  <button id="pdfButton">
    📄 PDFに保存 / 印刷
  </button>

</div>

<div class="settings">

  <div class="setting">
    <label for="heightInput">画像の高さ</label>
    <input
      id="heightInput"
      type="number"
      min="1"
      step="0.1"
      value="4.5"
    >
    cm
  </div>

  <div class="setting">
    <label for="gapInput">すき間</label>
    <input
      id="gapInput"
      type="number"
      min="0"
      step="0.1"
      value="0.3"
    >
    cm
  </div>

  <div class="setting">
    <label for="marginInput">余白</label>
    <input
      id="marginInput"
      type="number"
      min="0"
      step="0.1"
      value="0.5"
    >
    cm
  </div>

</div>

<div id="info" class="info"></div>

<div id="saveStatus" class="save-status"></div>

<div id="deleteModeMessage" class="delete-mode-message">
  🗑️ 削除モード中：消したい画像をクリックしてください
</div>

<div id="preview">
  <div class="empty">
    📷 画像を追加すると、ここにA4レイアウトが表示されます
  </div>
</div>


<script>

/* =========================================================
   設定
========================================================= */

const DB_NAME = "oshiScreenshotPrinter";
const DB_VERSION = 4;
const STORE_NAME = "images";

const A4_WIDTH = 297;
const A4_HEIGHT = 210;


/* =========================================================
   DOM
========================================================= */

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const info = document.getElementById("info");
const saveStatus = document.getElementById("saveStatus");

const pdfButton = document.getElementById("pdfButton");
const deleteModeButton =
  document.getElementById("deleteModeButton");

const clearButton =
  document.getElementById("clearButton");

const heightInput =
  document.getElementById("heightInput");

const gapInput =
  document.getElementById("gapInput");

const marginInput =
  document.getElementById("marginInput");

const deleteModeMessage =
  document.getElementById("deleteModeMessage");


/* =========================================================
   状態
========================================================= */

let db = null;
let images = [];
let deleteMode = false;


/* =========================================================
   IndexedDB
========================================================= */

function openDatabase(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = e => {

      const database = e.target.result;

      let store;

      if(!database.objectStoreNames.contains(STORE_NAME)){

        store = database.createObjectStore(
          STORE_NAME,
          {
            keyPath:"id",
            autoIncrement:true
          }
        );

      }else{

        store = e.target.transaction.objectStore(
          STORE_NAME
        );

      }

      /*
        回転角度は新しく追加した項目。

        既存データには rotation がないので、
        その場合は 0° として扱います。
      */
    };

    request.onsuccess = e => {

      db = e.target.result;

      resolve(db);

    };

    request.onerror = e => {

      reject(e.target.error);

    };

  });

}


/* =========================================================
   画像取得
========================================================= */

function getAllImages(){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readonly");

    const store =
      transaction.objectStore(STORE_NAME);

    const request =
      store.getAll();

    request.onsuccess = ()=>{

      const result = request.result || [];

      result.sort((a,b)=>{

        const ao =
          typeof a.order === "number"
            ? a.order
            : a.id;

        const bo =
          typeof b.order === "number"
            ? b.order
            : b.id;

        return ao-bo;

      });

      resolve(result);

    };

    request.onerror = e => {

      reject(e.target.error);

    };

  });

}


/* =========================================================
   画像保存
========================================================= */

function saveImage(blob,name){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    const request =
      store.add({

        blob:blob,

        name:name,

        created:Date.now(),

        order:Date.now(),

        /*
          新規画像は回転なし
        */
        rotation:0

      });

    request.onsuccess = ()=>resolve(request.result);

    request.onerror =
      e => reject(e.target.error);

  });

}


/* =========================================================
   画像削除
========================================================= */

function deleteImage(id){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    const request =
      store.delete(id);

    request.onsuccess = ()=>resolve();

    request.onerror =
      e => reject(e.target.error);

  });

}


/* =========================================================
   全削除
========================================================= */

function clearDatabase(){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    const request =
      store.clear();

    request.onsuccess = ()=>resolve();

    request.onerror =
      e => reject(e.target.error);

  });

}


/* =========================================================
   並び順保存
========================================================= */

function saveOrder(){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    images.forEach((image,index)=>{

      image.order = index;

      store.put(image);

    });

    transaction.oncomplete = ()=>resolve();

    transaction.onerror =
      e => reject(e.target.error);

  });

}


/* =========================================================
   回転保存
========================================================= */

function saveRotation(image){

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    store.put(image);

    transaction.oncomplete = ()=>resolve();

    transaction.onerror =
      e => reject(e.target.error);

  });

}


/* =========================================================
   画像を読み込み
========================================================= */

async function loadImages(){

  try{

    images = await getAllImages();

    /*
      古い画像には rotation が存在しないので
      0°として初期化
    */
    images.forEach(image=>{

      if(typeof image.rotation !== "number"){

        image.rotation = 0;

      }

    });

    await buildLayout();

  }catch(error){

    console.error(error);

    info.textContent =
      "画像の読み込みに失敗しました。";

  }

}


/* =========================================================
   画像の自然サイズ取得
========================================================= */

function getImageRatio(blob){

  return new Promise((resolve,reject)=>{

    const url =
      URL.createObjectURL(blob);

    const img =
      new Image();

    img.onload = ()=>{

      const ratio =
        img.naturalWidth /
        img.naturalHeight;

      URL.revokeObjectURL(url);

      resolve(ratio);

    };

    img.onerror = ()=>{

      URL.revokeObjectURL(url);

      reject(
        new Error("画像を読み込めませんでした")
      );

    };

    img.src = url;

  });

}


/* =========================================================
   回転を考慮した画像比率
========================================================= */

async function getDisplayedRatio(image){

  let ratio =
    await getImageRatio(image.blob);

  const rotation =
    image.rotation || 0;

  /*
    90° / 270°なら
    縦横が入れ替わる
  */
  if(rotation === 90 || rotation === 270){

    ratio = 1 / ratio;

  }

  return ratio;

}


/* =========================================================
   A4レイアウト作成
========================================================= */

async function buildLayout(){

  if(!images.length){

    preview.innerHTML = `
      <div class="empty">
        📷 画像を追加すると、ここにA4レイアウトが表示されます
      </div>
    `;

    info.textContent = "";

    return;

  }


  const height =
    Math.max(
      1,
      parseFloat(heightInput.value) || 4.5
    ) * 10;


  const gap =
    Math.max(
      0,
      parseFloat(gapInput.value) || 0.3
    ) * 10;


  const margin =
    Math.max(
      0,
      parseFloat(marginInput.value) || 0.5
    ) * 10;


  const usableWidth =
    A4_WIDTH - margin * 2;


  const usableHeight =
    A4_HEIGHT - margin * 2;


  const pages = [];

  let currentPage = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  for(const image of images){

    const ratio =
      await getDisplayedRatio(image);


    /*
      基本高さ
    */
    let itemHeight = height;

    let itemWidth =
      itemHeight * ratio;


    /*
      横幅がA4の使用可能幅を超える場合だけ
      個別に縮小する
    */
    if(itemWidth > usableWidth){

      itemWidth = usableWidth;

      itemHeight =
        itemWidth / ratio;

    }


    /*
      横に入らない場合は改行
    */
    if(
      x > margin &&
      x + itemWidth > A4_WIDTH - margin
    ){

      x = margin;

      y += rowHeight + gap;

      rowHeight = 0;

    }


    /*
      縦に入らない場合は新しいページ
    */
    if(
      y + itemHeight >
      A4_HEIGHT - margin
    ){

      pages.push(currentPage);

      currentPage = [];

      x = margin;

      y = margin;

      rowHeight = 0;

    }


    currentPage.push({

      image:image,

      left:x,

      top:y,

      width:itemWidth,

      height:itemHeight

    });


    x += itemWidth + gap;

    rowHeight =
      Math.max(
        rowHeight,
        itemHeight
      );

  }


  if(currentPage.length){

    pages.push(currentPage);

  }


  renderPages(pages,margin);

}


/* =========================================================
   A4ページ描画
========================================================= */

function renderPages(pages){

  preview.innerHTML = "";

  pages.forEach((pageItems,pageIndex)=>{

    const page =
      document.createElement("div");

    page.className = "page";


    pageItems.forEach(itemData=>{

      const image =
        itemData.image;


      const item =
        document.createElement("div");

      item.className = "item";

      item.draggable =
        !deleteMode;


      item.style.left =
        `${itemData.left}mm`;

      item.style.top =
        `${itemData.top}mm`;

      item.style.width =
        `${itemData.width}mm`;

      item.style.height =
        `${itemData.height}mm`;


      /*
        画像
      */

      const img =
        document.createElement("img");

      const imageUrl =
        URL.createObjectURL(image.blob);

      img.src = imageUrl;

      img.alt =
        image.name || "画像";

      /*
        回転
      */
      const rotation =
        image.rotation || 0;

      img.style.transform =
        `rotate(${rotation}deg)`;


      /*
        回転ボタン
      */

      const rotateButton =
        document.createElement("button");

      rotateButton.className =
        "rotate-button";

      rotateButton.type =
        "button";

      rotateButton.textContent =
        "↻";

      rotateButton.title =
        `回転：${rotation}°`;


      rotateButton.addEventListener(
        "click",
        async event=>{

          event.preventDefault();

          event.stopPropagation();

          if(deleteMode){

            return;

          }


          /*
            90°ずつ回転
          */

          image.rotation =
            ((image.rotation || 0) + 90) % 360;


          /*
            保存
          */

          try{

            await saveRotation(image);

            saveStatus.textContent =
              "✓ 回転を保存しました";

          }catch(error){

            console.error(error);

            saveStatus.textContent =
              "⚠ 回転の保存に失敗しました";

          }


          /*
            回転後の縦横比で
            A4をもう一度自動配置
          */

          await buildLayout();

        }
      );


      /*
        削除モード用 ×
      */

      if(deleteMode){

        const deleteMark =
          document.createElement("div");

        deleteMark.className =
          "delete-mark";

        deleteMark.textContent =
          "×";

        item.appendChild(deleteMark);

      }


      /*
        画像クリック
      */

      item.addEventListener(
        "click",
        async event=>{

          /*
            回転ボタンを押した場合は
            ここでは何もしない
          */
          if(
            event.target === rotateButton
          ){

            return;

          }


          if(!deleteMode){

            return;

          }


          try{

            await deleteImage(image.id);

            images =
              images.filter(
                x => x.id !== image.id
              );

            await saveOrder();

            saveStatus.textContent =
              "✓ 画像を削除しました";

            await buildLayout();

          }catch(error){

            console.error(error);

            saveStatus.textContent =
              "⚠ 削除に失敗しました";

          }

        }
      );


      item.appendChild(img);

      item.appendChild(rotateButton);

      setupDrag(item,image);


      page.appendChild(item);

    });


    preview.appendChild(page);

  });


  const pageCount =
    pages.length;

  info.textContent =
    `${images.length}枚 / A4 ${pageCount}ページ`;

}


/* =========================================================
   ドラッグ＆ドロップ
========================================================= */

function setupDrag(item,targetImage){

  item.addEventListener(
    "dragstart",
    event=>{

      if(deleteMode){

        event.preventDefault();

        return;

      }


      event.dataTransfer.effectAllowed =
        "move";

      event.dataTransfer.setData(
        "text/plain",
        String(targetImage.id)
      );

    }
  );


  item.addEventListener(
    "dragover",
    event=>{

      if(deleteMode){

        return;

      }

      event.preventDefault();

      item.classList.add("drag-over");

    }
  );


  item.addEventListener(
    "dragleave",
    ()=>{

      item.classList.remove(
        "drag-over"
      );

    }
  );


  item.addEventListener(
    "drop",
    async event=>{

      if(deleteMode){

        return;

      }

      event.preventDefault();

      item.classList.remove(
        "drag-over"
      );


      const draggedId =
        Number(
          event.dataTransfer.getData(
            "text/plain"
          )
        );


      if(!draggedId){

        return;

      }


      if(
        draggedId === targetImage.id
      ){

        return;

      }


      const fromIndex =
        images.findIndex(
          image =>
            image.id === draggedId
        );


      const toIndex =
        images.findIndex(
          image =>
            image.id === targetImage.id
        );


      if(
        fromIndex === -1 ||
        toIndex === -1
      ){

        return;

      }


      const [moved] =
        images.splice(
          fromIndex,
          1
        );


      images.splice(
        toIndex,
        0,
        moved
      );


      await saveOrder();

      saveStatus.textContent =
        "✓ 並び順を保存しました";

      await buildLayout();

    }
  );

}


/* =========================================================
   画像追加
========================================================= */

fileInput.addEventListener(
  "change",
  async event=>{

    const files =
      Array.from(
        event.target.files || []
      );


    if(!files.length){

      return;

    }


    saveStatus.textContent =
      "画像を保存しています…";


    try{

      for(const file of files){

        if(
          !file.type.startsWith("image/")
        ){

          continue;

        }

        await saveImage(
          file,
          file.name
        );

      }


      saveStatus.textContent =
        `✓ ${files.length}枚追加しました`;

      /*
        同じファイルをもう一度選択できるように
      */
      fileInput.value = "";


      await loadImages();

    }catch(error){

      console.error(error);

      saveStatus.textContent =
        "⚠ 画像の保存に失敗しました";

    }

  }
);


/* =========================================================
   削除モード
========================================================= */

deleteModeButton.addEventListener(
  "click",
  async ()=>{

    deleteMode =
      !deleteMode;


    deleteModeButton.classList.toggle(
      "active",
      deleteMode
    );


    deleteModeMessage.classList.toggle(
      "show",
      deleteMode
    );


    if(deleteMode){

      deleteModeButton.textContent =
        "🗑️ 削除モード終了";

    }else{

      deleteModeButton.textContent =
        "🗑️ 削除モード";

    }


    await buildLayout();

  }
);


/* =========================================================
   全部削除
========================================================= */

clearButton.addEventListener(
  "click",
  async ()=>{

    if(!images.length){

      return;

    }


    const answer =
      prompt(
        '全部削除する場合は「削除」と入力してください'
      );


    if(answer !== "削除"){

      return;

    }


    try{

      await clearDatabase();

      images = [];

      saveStatus.textContent =
        "✓ すべて削除しました";

      await buildLayout();

    }catch(error){

      console.error(error);

      saveStatus.textContent =
        "⚠ 削除に失敗しました";

    }

  }
);


/* =========================================================
   設定変更
========================================================= */

[
  heightInput,
  gapInput,
  marginInput
].forEach(input=>{

  input.addEventListener(
    "change",
    ()=>{

      buildLayout();

    }
  );

});


/* =========================================================
   PDF / 印刷
========================================================= */

pdfButton.addEventListener(
  "click",
  async ()=>{

    if(!images.length){

      alert(
        "まず画像を追加してください"
      );

      return;

    }


    /*
      印刷時は削除モードを解除
    */

    if(deleteMode){

      deleteMode = false;

      deleteModeButton.classList.remove(
        "active"
      );

      deleteModeButton.textContent =
        "🗑️ 削除モード";

      deleteModeMessage.classList.remove(
        "show"
      );

    }


    await buildLayout();


    /*
      描画が落ち着いてから印刷
    */

    setTimeout(()=>{

      window.print();

    },500);

  }
);


/* =========================================================
   起動
========================================================= */

(async function(){

  try{

    await openDatabase();

    await loadImages();

  }catch(error){

    console.error(error);

    info.textContent =
      "データベースを開けませんでした。";

  }

})();

</script>

</body>
