<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3f1;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #8f675b;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

/* =========================
   操作エリア
========================= */

.controls {
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

button,
.file-label {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
}

.file-label {
  background: #8f675b;
  color: white;
}

button {
  background: #d8c1b8;
  color: #4d403b;
}

button:hover,
.file-label:hover {
  opacity: 0.82;
}

input[type="file"] {
  display: none;
}

/* =========================
   設定
========================= */

.settings {
  padding: 0 18px 12px;

  display: flex;
  flex-wrap: wrap;

  gap: 15px;

  font-size: 13px;
}

.settings label {
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings input {
  width: 65px;

  padding: 6px 7px;

  border: 1px solid #d8cbc6;

  border-radius: 7px;

  background: white;
}

/* =========================
   情報
========================= */

.info {
  padding: 0 18px 4px;

  font-size: 13px;

  color: #786862;
}

.save-status {
  padding: 0 18px 15px;

  font-size: 12px;

  color: #8f675b;
}

/* =========================
   A4プレビュー
========================= */

#preview {
  padding: 20px;
}

.page {
  position: relative;

  width: 297mm;
  height: 210mm;

  margin: 0 auto 30px;

  background: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.12);

  overflow: hidden;
}

/* =========================
   画像
========================= */

.item {
  position: absolute;

  overflow: hidden;

  user-select: none;
  -webkit-user-select: none;

  cursor: pointer;

  transition:
    opacity 0.12s,
    transform 0.12s;
}

.item img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;

  pointer-events: none;

  user-select: none;
  -webkit-user-select: none;
}

/* 長押し中 */

.item.long-pressing {
  opacity: 0.55;

  transform: scale(0.96);
}

/* =========================
   削除確認モーダル
========================= */

.delete-modal {
  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(50, 40, 35, 0.35);

  padding: 20px;
}

.delete-modal.show {
  display: flex;
}

.delete-box {
  width: min(360px, 100%);

  background: white;

  border-radius: 18px;

  padding: 24px;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.2);

  text-align: center;
}

.delete-box-title {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;
}

.delete-box-text {
  font-size: 13px;

  color: #786862;

  margin-bottom: 20px;
}

.delete-actions {
  display: flex;

  gap: 10px;
}

.delete-actions button {
  flex: 1;
}

.cancel-delete {
  background: #eee6e2;
}

.confirm-delete {
  background: #8f675b;

  color: white;
}

/* =========================
   印刷
========================= */

@media print {

  body {
    background: white;
  }

  header,
  .controls,
  .settings,
  .info,
  .save-status {
    display: none !important;
  }

  #preview {
    padding: 0;
  }

  .page {
    margin: 0;

    box-shadow: none;

    page-break-after: always;
    break-after: page;
  }

  .page:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }
}

/* =========================
   PC画面でA4が大きすぎる場合
========================= */

@media screen and (max-width: 1100px) {

  .page {
    transform-origin: top left;

    transform: scale(0.65);

    margin-bottom: -70mm;

    margin-left: 0;
  }
}
</style>
</head>


<body>

<header>
  <h1>推しスクショ A4プリンター</h1>
  <p>スクショを選んで、A4にかわいく敷き詰めよう♡</p>
</header>


<div class="controls">

  <!-- 画像追加 -->

  <label class="file-label">

    📷 スクショを追加

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

  </label>


  <!-- PDF -->

  <button id="pdfButton">
    🖨️ PDF出力
  </button>


  <!-- 全削除 -->

  <button id="clearButton">
    🗑️ 全部削除
  </button>

</div>


<div class="settings">

  <label>
    基本の高さ

    <input
      id="heightInput"
      type="number"
      value="4.5"
      min="1"
      max="10"
      step="0.1"
    >

    cm
  </label>


  <label>
    画像のすき間

    <input
      id="gapInput"
      type="number"
      value="0.3"
      min="0"
      max="3"
      step="0.1"
    >

    cm
  </label>


  <label>
    A4の余白

    <input
      id="marginInput"
      type="number"
      value="0.5"
      min="0"
      max="3"
      step="0.1"
    >

    cm
  </label>

</div>


<div class="info" id="info">
  画像はまだありません
</div>


<div class="save-status" id="saveStatus">
  読み込み中…
</div>


<div id="preview"></div>


<!-- =========================
     削除確認
========================= -->

<div
  id="deleteModal"
  class="delete-modal"
>

  <div class="delete-box">

    <div class="delete-box-title">
      この画像を削除する？
    </div>

    <div class="delete-box-text">
      この画像だけ削除します。
    </div>

    <div class="delete-actions">

      <button
        id="cancelDelete"
        class="cancel-delete"
      >
        キャンセル
      </button>

      <button
        id="confirmDelete"
        class="confirm-delete"
      >
        削除する
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   IndexedDB
===================================================== */

const DB_NAME =
  "oshiScreenshotPrinter";

const DB_VERSION = 1;

const STORE_NAME =
  "images";

let db;


/* =====================================================
   IndexedDBを開く
===================================================== */

function openDatabase() {

  return new Promise(function(resolve, reject) {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const database =
          event.target.result;


        if (
          !database.objectStoreNames.contains(
            STORE_NAME
          )
        ) {

          database.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };


    request.onsuccess =
      function(event) {

        db = event.target.result;

        resolve(db);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DB：全部取得
===================================================== */

function getAllImages() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readonly"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.getAll();


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DB：画像保存
===================================================== */

function saveImage(blob, name) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.add({

        blob: blob,

        name: name,

        created: Date.now()

      });


    request.onsuccess =
      function() {

        resolve(request.result);

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DB：画像削除
===================================================== */

function deleteImage(id) {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.delete(id);


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DB：全部削除
===================================================== */

function clearDatabase() {

  return new Promise(function(resolve, reject) {

    const transaction =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.clear();


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(request.error);

      };

  });

}


/* =====================================================
   DOM
===================================================== */

const fileInput =
  document.getElementById(
    "fileInput"
  );

const preview =
  document.getElementById(
    "preview"
  );

const info =
  document.getElementById(
    "info"
  );

const saveStatus =
  document.getElementById(
    "saveStatus"
  );

const pdfButton =
  document.getElementById(
    "pdfButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const heightInput =
  document.getElementById(
    "heightInput"
  );

const gapInput =
  document.getElementById(
    "gapInput"
  );

const marginInput =
  document.getElementById(
    "marginInput"
  );

const deleteModal =
  document.getElementById(
    "deleteModal"
  );

const cancelDelete =
  document.getElementById(
    "cancelDelete"
  );

const confirmDelete =
  document.getElementById(
    "confirmDelete"
  );


/* =====================================================
   データ
===================================================== */

let images = [];


/*
 * 現在削除確認中の画像
 */

let pendingDeleteId = null;


/* =====================================================
   DBから画像読み込み
===================================================== */

async function loadImages() {

  images =
    await getAllImages();


  /*
   * 追加した順番を維持
   */

  images.sort(
    function(a, b) {

      return a.id - b.id;

    }
  );


  /*
   * 自動配置
   */

  await buildLayout();


  if (images.length > 0) {

    saveStatus.textContent =
      "✓ 自動保存されています";

  } else {

    saveStatus.textContent =
      "画像を追加すると自動保存されます";

  }

}


/* =====================================================
   画像追加
===================================================== */

fileInput.addEventListener(
  "change",
  async function(event) {

    const files =
      Array.from(
        event.target.files
      );


    if (files.length === 0) {
      return;
    }


    saveStatus.textContent =
      "保存中…";


    try {

      for (
        const file of files
      ) {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          continue;

        }


        /*
         * File / Blobそのものを保存
         */

        await saveImage(
          file,
          file.name
        );

      }


      /*
       * 保存後に再読み込み
       */

      await loadImages();


      saveStatus.textContent =
        "✓ 自動保存しました";


    } catch(error) {

      console.error(error);

      saveStatus.textContent =
        "保存に失敗しました";

      alert(
        "画像の保存に失敗しました。"
      );

    }


    /*
     * 同じ画像を再度選択できるようにする
     */

    fileInput.value = "";

  }
);


/* =====================================================
   A4レイアウト作成
===================================================== */

async function buildLayout() {

  preview.innerHTML = "";


  if (images.length === 0) {

    info.textContent =
      "画像はまだありません";

    return;

  }


  /*
   * A4横
   */

  const A4_WIDTH = 297;

  const A4_HEIGHT = 210;


  /*
   * cm → mm
   */

  const targetHeight =
    Number(
      heightInput.value
    ) * 10;

  const gap =
    Number(
      gapInput.value
    ) * 10;

  const margin =
    Number(
      marginInput.value
    ) * 10;


  /*
   * 画像の実寸比率を取得
   */

  const measuredImages =
    await Promise.all(

      images.map(
        function(item) {

          return new Promise(
            function(resolve) {

              const url =
                URL.createObjectURL(
                  item.blob
                );

              const img =
                new Image();


              img.onload =
                function() {

                  const ratio =
                    img.naturalWidth /
                    img.naturalHeight;


                  URL.revokeObjectURL(
                    url
                  );


                  resolve({

                    item: item,

                    ratio: ratio

                  });

                };


              img.onerror =
                function() {

                  URL.revokeObjectURL(
                    url
                  );


                  /*
                   * 万一読み込めなかった場合
                   */

                  resolve({

                    item: item,

                    ratio: 1

                  });

                };


              img.src = url;

            }
          );

        }
      )

    );


  /*
   * ページごとに画像を振り分ける
   */

  const pages = [];

  let page = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  measuredImages.forEach(
    function(data) {

      let h =
        targetHeight;

      let w =
        h * data.ratio;


      /*
       * 横幅がA4の使用可能幅を超える場合だけ
       * その画像だけ縮小
       */

      const usableWidth =
        A4_WIDTH - margin * 2;


      if (w > usableWidth) {

        w = usableWidth;

        h =
          w / data.ratio;

      }


      /*
       * 横に入らない
       * ↓
       * 次の段
       */

      if (
        x !== margin &&
        x + w >
          A4_WIDTH - margin
      ) {

        x = margin;

        y +=
          rowHeight + gap;

        rowHeight = 0;

      }


      /*
       * 縦に入らない
       * ↓
       * 次のページ
       */

      if (
        y + h >
          A4_HEIGHT - margin
      ) {

        if (
          page.length > 0
        ) {

          pages.push(page);

        }


        page = [];

        x = margin;

        y = margin;

        rowHeight = 0;

      }


      /*
       * 配置情報
       */

      page.push({

        image: data.item,

        x: x,

        y: y,

        width: w,

        height: h

      });


      /*
       * 次の画像位置
       */

      x +=
        w + gap;


      rowHeight =
        Math.max(
          rowHeight,
          h
        );

    }
  );


  /*
   * 最後のページ
   */

  if (page.length > 0) {

    pages.push(page);

  }


  /*
   * 描画
   */

  renderPages(pages);

}


/* =====================================================
   A4ページ描画
===================================================== */

function renderPages(pages) {

  preview.innerHTML = "";


  pages.forEach(
    function(pageItems) {

      const page =
        document.createElement(
          "div"
        );

      page.className =
        "page";


      pageItems.forEach(
        function(item) {

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "item";


          box.style.left =
            item.x + "mm";

          box.style.top =
            item.y + "mm";

          box.style.width =
            item.width + "mm";

          box.style.height =
            item.height + "mm";


          /*
           * Blob URL
           */

          const url =
            URL.createObjectURL(
              item.image.blob
            );


          const img =
            document.createElement(
              "img"
            );


          img.src = url;


          /*
           * ページから消えたらURL解放
           */

          img.onload =
            function() {

              /*
               * 印刷時に必要なので
               * すぐには解放しない
               */

            };


          box.appendChild(img);

          page.appendChild(box);


          /*
           * 長押し削除
           */

          setupLongPress(
            box,
            item.image.id
          );

        }
      );


      preview.appendChild(page);

    }
  );


  info.textContent =
    images.length +
    "枚 / " +
    pages.length +
    "ページ";

}


/* =====================================================
   長押し削除
===================================================== */

function setupLongPress(
  element,
  imageId
) {

  let timer = null;

  let cancelled = false;


  /*
   * 長押し開始
   */

  function startPress() {

    cancelled = false;


    element.classList.add(
      "long-pressing"
    );


    timer =
      setTimeout(
        function() {

          if (cancelled) {
            return;
          }


          element.classList.remove(
            "long-pressing"
          );


          /*
           * 削除確認を表示
           */

          openDeleteModal(
            imageId
          );


        },
        650
      );

  }


  /*
   * 長押し終了
   */

  function endPress() {

    cancelled = true;


    if (timer !== null) {

      clearTimeout(timer);

      timer = null;

    }


    element.classList.remove(
      "long-pressing"
    );

  }


  /*
   * PC
   */

  element.addEventListener(
    "mousedown",
    function(event) {

      if (
        event.button !== 0
      ) {

        return;

      }


      startPress();

    }
  );


  element.addEventListener(
    "mouseup",
    endPress
  );


  element.addEventListener(
    "mouseleave",
    endPress
  );


  /*
   * スマホ・タブレット
   */

  element.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      startPress();

    },
    {
      passive: false
    }
  );


  element.addEventListener(
    "touchend",
    function() {

      endPress();

    }
  );


  element.addEventListener(
    "touchcancel",
    function() {

      endPress();

    }
  );

}


/* =====================================================
   削除確認を表示
===================================================== */

function openDeleteModal(
  imageId
) {

  pendingDeleteId =
    imageId;


  deleteModal.classList.add(
    "show"
  );

}


/* =====================================================
   削除確認を閉じる
===================================================== */

function closeDeleteModal() {

  pendingDeleteId =
    null;


  deleteModal.classList.remove(
    "show"
  );

}


/* =====================================================
   キャンセル
===================================================== */

cancelDelete.addEventListener(
  "click",
  function() {

    closeDeleteModal();

  }
);


/* =====================================================
   削除する
===================================================== */

confirmDelete.addEventListener(
  "click",
  async function() {

    if (
      pendingDeleteId === null
    ) {

      return;

    }


    const id =
      pendingDeleteId;


    closeDeleteModal();


    try {

      await deleteImage(id);

      await loadImages();


      saveStatus.textContent =
        "✓ 画像を削除しました";


    } catch(error) {

      console.error(error);

      alert(
        "画像を削除できませんでした"
      );

    }

  }
);


/* =====================================================
   モーダルの外側をクリック
===================================================== */

deleteModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      deleteModal
    ) {

      closeDeleteModal();

    }

  }
);


/* =====================================================
   設定変更
===================================================== */

heightInput.addEventListener(
  "change",
  buildLayout
);

gapInput.addEventListener(
  "change",
  buildLayout
);

marginInput.addEventListener(
  "change",
  buildLayout
);


/* =====================================================
   PDF出力
===================================================== */

pdfButton.addEventListener(
  "click",
  async function() {

    if (images.length === 0) {

      alert(
        "先にスクショを追加してね！"
      );

      return;

    }


    /*
     * 最新状態にする
     */

    await buildLayout();


    /*
     * 画像の描画が終わってから印刷
     */

    setTimeout(
      function() {

        window.print();

      },
      500
    );

  }
);


/* =====================================================
   全削除
===================================================== */

clearButton.addEventListener(
  "click",
  async function() {

    if (images.length === 0) {

      return;

    }


    /*
     * confirm()は使わない
     * 今回は全削除だけ別確認。
     */

    const ok =
      window.prompt(
        "全部削除する場合は「削除」と入力してください"
      );


    if (ok !== "削除") {

      return;

    }


    try {

      await clearDatabase();

      await loadImages();


      saveStatus.textContent =
        "✓ すべて削除しました";


    } catch(error) {

      console.error(error);

      alert(
        "削除できませんでした"
      );

    }

  }
);


/* =====================================================
   起動
===================================================== */

(async function() {

  try {

    await openDatabase();

    await loadImages();

  } catch(error) {

    console.error(error);

    saveStatus.textContent =
      "保存機能を開始できませんでした";

  }

})();

</script>

</body>
</html>
