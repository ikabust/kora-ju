<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f1ef;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #8f675b;
  color: white;
  padding: 18px 24px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: 0.9;
}

/* =========================
   操作エリア
========================= */

.controls {
  padding: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

button,
.file-label {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-size: 14px;
  cursor: pointer;
  background: #8f675b;
  color: white;
}

button:hover,
.file-label:hover {
  opacity: 0.85;
}

.file-label {
  display: inline-block;
}

input[type="file"] {
  display: none;
}

.settings {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  padding: 0 18px 15px;
  font-size: 14px;
}

.settings label {
  display: flex;
  align-items: center;
  gap: 6px;
}

.settings input {
  width: 70px;
  padding: 6px 8px;
  border: 1px solid #d8cbc6;
  border-radius: 7px;
}

/* =========================
   情報
========================= */

.info {
  padding: 0 18px 15px;
  font-size: 13px;
  color: #786862;
}

/* =========================
   プレビュー
========================= */

#preview {
  padding: 20px;
}

.page {
  position: relative;

  /* A4横 */
  width: 297mm;
  height: 210mm;

  margin: 0 auto 30px;

  background: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.12);

  overflow: hidden;
}

/* =========================
   画像
========================= */

.item {
  position: absolute;
  overflow: hidden;
}

.item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* =========================
   印刷
========================= */

@media print {

  body {
    background: white;
  }

  header,
  .controls,
  .settings,
  .info {
    display: none !important;
  }

  #preview {
    padding: 0;
  }

  .page {
    margin: 0;
    box-shadow: none;

    page-break-after: always;
  }

  .page:last-child {
    page-break-after: auto;
  }

  @page {
    size: A4 landscape;
    margin: 0;
  }
}

/* =========================
   スマホ・小さい画面
========================= */

@media screen and (max-width: 1000px) {

  .page {
    transform-origin: top left;
    transform: scale(0.7);

    margin-bottom: -60mm;
    margin-left: 0;
  }

}
</style>
</head>

<body>

<header>
  <h1>推しスクショ A4プリンター</h1>
  <p>スクショを選んで、A4に自動で敷き詰めよう♡</p>
</header>

<div class="controls">

  <!-- 画像追加 -->
  <label class="file-label">
    📷 スクショを追加
    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >
  </label>

  <!-- 配置 -->
  <button id="layoutButton">
    🖼️ A4に敷き詰める
  </button>

  <!-- 印刷 -->
  <button id="printButton">
    🖨️ 印刷する
  </button>

  <!-- 全削除 -->
  <button id="clearButton">
    🗑️ 全部消す
  </button>

</div>

<div class="settings">

  <label>
    基本の高さ
    <input
      id="heightInput"
      type="number"
      value="4.5"
      min="1"
      max="10"
      step="0.1"
    >
    cm
  </label>

  <label>
    画像のすき間
    <input
      id="gapInput"
      type="number"
      value="0.3"
      min="0"
      max="3"
      step="0.1"
    >
    cm
  </label>

  <label>
    A4の余白
    <input
      id="marginInput"
      type="number"
      value="0.5"
      min="0"
      max="3"
      step="0.1"
    >
    cm
  </label>

</div>

<div class="info" id="info">
  まだ画像がありません
</div>

<div id="preview"></div>


<script>

/* =========================================================
   データ
========================================================= */

let images = [];


/* =========================================================
   DOM
========================================================= */

const fileInput =
  document.getElementById("fileInput");

const layoutButton =
  document.getElementById("layoutButton");

const printButton =
  document.getElementById("printButton");

const clearButton =
  document.getElementById("clearButton");

const preview =
  document.getElementById("preview");

const info =
  document.getElementById("info");

const heightInput =
  document.getElementById("heightInput");

const gapInput =
  document.getElementById("gapInput");

const marginInput =
  document.getElementById("marginInput");


/* =========================================================
   画像追加
========================================================= */

fileInput.addEventListener("change", function(event) {

  const files = Array.from(event.target.files);

  if (!files.length) {
    return;
  }

  let loaded = 0;

  files.forEach(function(file) {

    if (!file.type.startsWith("image/")) {
      loaded++;
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      const img = new Image();

      img.onload = function() {

        images.push({
          src: e.target.result,
          width: img.naturalWidth,
          height: img.naturalHeight
        });

        loaded++;

        updateInfo();

        /*
         * 画像を追加したら自動的に
         * A4へ配置
         */
        buildLayout();

      };

      img.src = e.target.result;

    };

    reader.readAsDataURL(file);

  });

  /*
   * 同じ画像をもう一度選べるようにする
   */
  fileInput.value = "";

});


/* =========================================================
   情報表示
========================================================= */

function updateInfo() {

  if (images.length === 0) {

    info.textContent =
      "まだ画像がありません";

    return;
  }

  info.textContent =
    images.length +
    "枚の画像を読み込み中・配置済み";
}


/* =========================================================
   A4配置
========================================================= */

function buildLayout() {

  if (images.length === 0) {

    preview.innerHTML = "";

    updateInfo();

    return;
  }

  /*
   * A4横
   *
   * 幅 297mm
   * 高さ 210mm
   */

  const A4_WIDTH = 297;
  const A4_HEIGHT = 210;

  /*
   * cm → mm
   */

  const targetHeight =
    Number(heightInput.value) * 10;

  const gap =
    Number(gapInput.value) * 10;

  const margin =
    Number(marginInput.value) * 10;


  /*
   * 実際に使える範囲
   */

  const usableWidth =
    A4_WIDTH - margin * 2;

  const usableHeight =
    A4_HEIGHT - margin * 2;


  /*
   * ページを作る
   */

  const pages = [];

  let currentPage = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  /*
   * 画像を選んだ順番に配置
   */

  images.forEach(function(image) {

    /*
     * 元画像の縦横比
     */

    const ratio =
      image.width / image.height;


    /*
     * 基本の高さ
     *
     * 例：
     * 高さ45mmなら
     * 横幅は元画像の比率で決定
     */

    let h = targetHeight;

    let w = h * ratio;


    /*
     * 横幅がA4の使用可能幅より
     * 大きい場合だけ縮小
     *
     * それ以外は高さ4.5cmを維持
     */

    if (w > usableWidth) {

      w = usableWidth;
      h = w / ratio;

    }


    /*
     * 今の段に入らないなら
     * 次の段へ
     */

    if (
      x !== margin &&
      x + w > A4_WIDTH - margin
    ) {

      x = margin;

      y += rowHeight + gap;

      rowHeight = 0;

    }


    /*
     * 縦方向に入らないなら
     * 次のページへ
     */

    if (
      y + h > A4_HEIGHT - margin
    ) {

      pages.push(currentPage);

      currentPage = [];

      x = margin;
      y = margin;
      rowHeight = 0;

    }


    /*
     * 配置情報
     */

    currentPage.push({
      src: image.src,
      x: x,
      y: y,
      width: w,
      height: h
    });


    /*
     * 次の位置
     */

    x += w + gap;

    rowHeight =
      Math.max(rowHeight, h);

  });


  /*
   * 最後のページを追加
   */

  if (currentPage.length > 0) {

    pages.push(currentPage);

  }


  /*
   * 表示を作る
   */

  renderPages(pages);

}


/* =========================================================
   ページ描画
========================================================= */

function renderPages(pages) {

  preview.innerHTML = "";


  pages.forEach(function(pageItems, pageIndex) {

    const page =
      document.createElement("div");

    page.className = "page";


    pageItems.forEach(function(item) {

      const box =
        document.createElement("div");

      box.className = "item";


      /*
       * mm → CSSでそのまま指定
       */

      box.style.left =
        item.x + "mm";

      box.style.top =
        item.y + "mm";

      box.style.width =
        item.width + "mm";

      box.style.height =
        item.height + "mm";


      const img =
        document.createElement("img");

      img.src = item.src;


      box.appendChild(img);

      page.appendChild(box);

    });


    preview.appendChild(page);

  });


  info.textContent =
    images.length +
    "枚 / " +
    pages.length +
    "ページ";

}


/* =========================================================
   A4に敷き詰めるボタン
========================================================= */

layoutButton.addEventListener(
  "click",
  function() {

    buildLayout();

  }
);


/* =========================================================
   印刷
========================================================= */

printButton.addEventListener(
  "click",
  function() {

    if (images.length === 0) {

      alert("先に画像を追加してね！");

      return;
    }

    buildLayout();

    setTimeout(function() {

      window.print();

    }, 200);

  }
);


/* =========================================================
   全削除
========================================================= */

clearButton.addEventListener(
  "click",
  function() {

    if (images.length === 0) {
      return;
    }


    const ok =
      confirm(
        "読み込んだ画像を全部消しますか？"
      );


    if (!ok) {
      return;
    }


    images = [];

    preview.innerHTML = "";

    updateInfo();

  }
);


/* =========================================================
   設定変更時
========================================================= */

heightInput.addEventListener(
  "change",
  buildLayout
);

gapInput.addEventListener(
  "change",
  buildLayout
);

marginInput.addEventListener(
  "change",
  buildLayout
);


/* =========================================================
   初期状態
========================================================= */

updateInfo();

</script>

</body>
</html>
