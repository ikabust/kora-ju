<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>推しスクショ A4プリンター</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f3f1;
  color: #4d403b;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

/* =========================
   ヘッダー
========================= */

header {
  background: #8f675b;
  color: white;
  padding: 20px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 6px 0 0;
  font-size: 13px;
}

/* =========================
   操作
========================= */

.controls {
  padding: 18px;

  display: flex;
  flex-wrap: wrap;

  gap: 10px;
}

button,
.file-label {
  border: none;

  border-radius: 10px;

  padding: 11px 16px;

  font-size: 14px;

  cursor: pointer;
}

.file-label {
  background: #8f675b;
  color: white;
}

button {
  background: #d8c1b8;
  color: #4d403b;
}

button:hover,
.file-label:hover {
  opacity: 0.82;
}

input[type="file"] {
  display: none;
}

/* =========================
   設定
========================= */

.settings {
  padding: 0 18px 12px;

  display: flex;
  flex-wrap: wrap;

  gap: 15px;

  font-size: 13px;
}

.settings label {
  display: flex;

  align-items: center;

  gap: 6px;
}

.settings input {
  width: 65px;

  padding: 6px;

  border: 1px solid #d8cbc6;

  border-radius: 7px;
}

/* =========================
   情報
========================= */

.info {
  padding: 0 18px 4px;

  font-size: 13px;

  color: #786862;
}

.save-status {
  padding: 0 18px 15px;

  font-size: 12px;

  color: #8f675b;
}

/* =========================
   A4
========================= */

#preview {
  padding: 20px;
}

.page {
  position: relative;

  width: 297mm;
  height: 210mm;

  margin: 0 auto 30px;

  background: white;

  box-shadow:
    0 4px 20px rgba(0,0,0,0.12);

  overflow: hidden;
}

/* =========================
   画像
========================= */

.item {
  position: absolute;

  overflow: hidden;

  cursor: grab;

  user-select: none;
  -webkit-user-select: none;

  transition:
    opacity 0.15s,
    transform 0.15s;
}

.item:active {
  cursor: grabbing;
}

.item img {
  display: block;

  width: 100%;
  height: 100%;

  object-fit: contain;

  pointer-events: none;

  user-select: none;
  -webkit-user-select: none;
}

/* ドラッグ中 */

.item.dragging {
  opacity: 0.45;

  transform: scale(0.95);
}

/* ドロップ先 */

.item.drag-over {
  outline: 3px solid #8f675b;

  outline-offset: 2px;

  transform: scale(1.03);
}

/* =========================
   長押し中
========================= */

.item.long-pressing {
  opacity: 0.55;

  transform: scale(0.96);
}

/* =========================
   削除モーダル
========================= */

.delete-modal {
  position: fixed;

  inset: 0;

  z-index: 9999;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(50,40,35,0.35);

  padding: 20px;
}

.delete-modal.show {
  display: flex;
}

.delete-box {
  width: min(360px, 100%);

  background: white;

  border-radius: 18px;

  padding: 24px;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.2);

  text-align: center;
}

.delete-title {
  font-size: 17px;

  font-weight: bold;

  margin-bottom: 8px;
}

.delete-text {
  font-size: 13px;

  color: #786862;

  margin-bottom: 20px;
}

.delete-actions {
  display: flex;

  gap: 10px;
}

.delete-actions button {
  flex: 1;
}

.cancel-delete {
  background: #eee6e2;
}

.confirm-delete {
  background: #8f675b;

  color: white;
}

/* =========================
   印刷
========================= */

@media print {

  body {
    background: white;
  }

  header,
  .controls,
  .settings,
  .info,
  .save-status {
    display: none !important;
  }

  #preview {
    padding: 0;
  }

  .page {
    margin: 0;

    box-shadow: none;

    page-break-after: always;

    break-after: page;
  }

  .page:last-child {
    page-break-after: auto;

    break-after: auto;
  }

  @page {
    size: A4 landscape;

    margin: 0;
  }
}

/* =========================
   小さい画面
========================= */

@media screen and (max-width: 1100px) {

  .page {
    transform-origin: top left;

    transform: scale(0.65);

    margin-bottom: -70mm;

    margin-left: 0;
  }

}
</style>
</head>


<body>

<header>

  <h1>
    推しスクショ A4プリンター
  </h1>

  <p>
    スクショを選んで、A4にかわいく敷き詰めよう♡
  </p>

</header>


<div class="controls">

  <!-- 画像追加 -->

  <label class="file-label">

    📷 スクショを追加

    <input
      id="fileInput"
      type="file"
      accept="image/*"
      multiple
    >

  </label>


  <!-- PDF -->

  <button id="pdfButton">
    🖨️ PDF出力
  </button>


  <!-- 全削除 -->

  <button id="clearButton">
    🗑️ 全部削除
  </button>

</div>


<div class="settings">

  <label>

    基本の高さ

    <input
      id="heightInput"
      type="number"
      value="4.5"
      min="1"
      max="10"
      step="0.1"
    >

    cm

  </label>


  <label>

    画像のすき間

    <input
      id="gapInput"
      type="number"
      value="0.3"
      min="0"
      max="3"
      step="0.1"
    >

    cm

  </label>


  <label>

    A4の余白

    <input
      id="marginInput"
      type="number"
      value="0.5"
      min="0"
      max="3"
      step="0.1"
    >

    cm

  </label>

</div>


<div
  class="info"
  id="info"
>
  画像はまだありません
</div>


<div
  class="save-status"
  id="saveStatus"
>
  読み込み中…
</div>


<div id="preview"></div>


<!-- =========================
     削除確認
========================= -->

<div
  id="deleteModal"
  class="delete-modal"
>

  <div class="delete-box">

    <div class="delete-title">
      この画像を削除する？
    </div>

    <div class="delete-text">
      この画像だけ削除します。
    </div>

    <div class="delete-actions">

      <button
        id="cancelDelete"
        class="cancel-delete"
      >
        キャンセル
      </button>

      <button
        id="confirmDelete"
        class="confirm-delete"
      >
        削除する
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   IndexedDB
===================================================== */

const DB_NAME =
  "oshiScreenshotPrinter";

const DB_VERSION = 2;

const STORE_NAME =
  "images";

let db;


/* =====================================================
   DBを開く
===================================================== */

function openDatabase() {

  return new Promise(
    function(resolve, reject) {

      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const database =
            event.target.result;


          if (
            !database.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            database.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

        };


      request.onsuccess =
        function(event) {

          db =
            event.target.result;

          resolve(db);

        };


      request.onerror =
        function() {

          reject(request.error);

        };

    }
  );

}


/* =====================================================
   DBから全画像
===================================================== */

function getAllImages() {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.getAll();


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   画像保存
===================================================== */

function saveImage(
  blob,
  name
) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.add({

          blob: blob,

          name: name,

          created: Date.now(),

          order: Date.now() +
            Math.random()

        });


      request.onsuccess =
        function() {

          resolve(
            request.result
          );

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   画像削除
===================================================== */

function deleteImage(id) {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.delete(id);


      request.onsuccess =
        function() {

          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   全削除
===================================================== */

function clearDatabase() {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.clear();


      request.onsuccess =
        function() {

          resolve();

        };


      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* =====================================================
   順番を保存
===================================================== */

function saveOrder() {

  return new Promise(
    function(resolve, reject) {

      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );


      let completed = 0;


      if (images.length === 0) {

        resolve();

        return;

      }


      images.forEach(
        function(image, index) {

          image.order = index;


          const request =
            store.put(image);


          request.onsuccess =
            function() {

              completed++;


              if (
                completed ===
                images.length
              ) {

                resolve();

              }

            };


          request.onerror =
            function() {

              reject(
                request.error
              );

            };

        }
      );

    }
  );

}


/* =====================================================
   DOM
===================================================== */

const fileInput =
  document.getElementById(
    "fileInput"
  );

const preview =
  document.getElementById(
    "preview"
  );

const info =
  document.getElementById(
    "info"
  );

const saveStatus =
  document.getElementById(
    "saveStatus"
  );

const pdfButton =
  document.getElementById(
    "pdfButton"
  );

const clearButton =
  document.getElementById(
    "clearButton"
  );

const heightInput =
  document.getElementById(
    "heightInput"
  );

const gapInput =
  document.getElementById(
    "gapInput"
  );

const marginInput =
  document.getElementById(
    "marginInput"
  );

const deleteModal =
  document.getElementById(
    "deleteModal"
  );

const cancelDelete =
  document.getElementById(
    "cancelDelete"
  );

const confirmDelete =
  document.getElementById(
    "confirmDelete"
  );


let images = [];


/*
 * 削除確認中の画像
 */

let pendingDeleteId =
  null;


/* =====================================================
   DBから読み込み
===================================================== */

async function loadImages() {

  images =
    await getAllImages();


  /*
   * 保存されている順番
   */

  images.sort(
    function(a, b) {

      return (
        (a.order ?? a.id) -
        (b.order ?? b.id)
      );

    }
  );


  await buildLayout();


  if (images.length > 0) {

    saveStatus.textContent =
      "✓ 自動保存されています";

  } else {

    saveStatus.textContent =
      "画像を追加すると自動保存されます";

  }

}


/* =====================================================
   画像追加
===================================================== */

fileInput.addEventListener(
  "change",
  async function(event) {

    const files =
      Array.from(
        event.target.files
      );


    if (
      files.length === 0
    ) {

      return;

    }


    saveStatus.textContent =
      "保存中…";


    try {

      for (
        const file of files
      ) {

        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          continue;

        }


        await saveImage(
          file,
          file.name
        );

      }


      await loadImages();


      saveStatus.textContent =
        "✓ 自動保存しました";


    } catch(error) {

      console.error(error);

      saveStatus.textContent =
        "保存に失敗しました";

    }


    /*
     * 同じファイルを再選択可能にする
     */

    fileInput.value = "";

  }
);


/* =====================================================
   A4レイアウト
===================================================== */

async function buildLayout() {

  preview.innerHTML = "";


  if (
    images.length === 0
  ) {

    info.textContent =
      "画像はまだありません";

    return;

  }


  const A4_WIDTH = 297;

  const A4_HEIGHT = 210;


  const targetHeight =
    Number(
      heightInput.value
    ) * 10;

  const gap =
    Number(
      gapInput.value
    ) * 10;

  const margin =
    Number(
      marginInput.value
    ) * 10;


  /*
   * 画像の縦横比取得
   */

  const measured =
    await Promise.all(

      images.map(
        function(item) {

          return new Promise(
            function(resolve) {

              const url =
                URL.createObjectURL(
                  item.blob
                );

              const img =
                new Image();


              img.onload =
                function() {

                  const ratio =
                    img.naturalWidth /
                    img.naturalHeight;


                  URL.revokeObjectURL(
                    url
                  );


                  resolve({

                    image: item,

                    ratio: ratio

                  });

                };


              img.onerror =
                function() {

                  URL.revokeObjectURL(
                    url
                  );


                  resolve({

                    image: item,

                    ratio: 1

                  });

                };


              img.src = url;

            }
          );

        }
      )

    );


  const pages = [];

  let page = [];

  let x = margin;

  let y = margin;

  let rowHeight = 0;


  measured.forEach(
    function(data) {

      let h =
        targetHeight;

      let w =
        h * data.ratio;


      /*
       * 横幅がA4より大きい場合だけ縮小
       */

      const usableWidth =
        A4_WIDTH -
        margin * 2;


      if (
        w > usableWidth
      ) {

        w = usableWidth;

        h =
          w / data.ratio;

      }


      /*
       * 横に入らない
       * → 次の段
       */

      if (
        x !== margin &&
        x + w >
          A4_WIDTH - margin
      ) {

        x = margin;

        y +=
          rowHeight + gap;

        rowHeight = 0;

      }


      /*
       * 下に入らない
       * → 次のページ
       */

      if (
        y + h >
          A4_HEIGHT - margin
      ) {

        if (
          page.length > 0
        ) {

          pages.push(page);

        }


        page = [];

        x = margin;

        y = margin;

        rowHeight = 0;

      }


      page.push({

        image: data.image,

        x: x,

        y: y,

        width: w,

        height: h

      });


      x +=
        w + gap;


      rowHeight =
        Math.max(
          rowHeight,
          h
        );

    }
  );


  if (
    page.length > 0
  ) {

    pages.push(page);

  }


  renderPages(pages);

}


/* =====================================================
   A4描画
===================================================== */

function renderPages(
  pages
) {

  preview.innerHTML = "";


  pages.forEach(
    function(pageItems) {

      const page =
        document.createElement(
          "div"
        );

      page.className =
        "page";


      pageItems.forEach(
        function(item) {

          const box =
            document.createElement(
              "div"
            );

          box.className =
            "item";

          box.draggable =
            true;


          box.dataset.id =
            item.image.id;


          box.style.left =
            item.x + "mm";

          box.style.top =
            item.y + "mm";

          box.style.width =
            item.width + "mm";

          box.style.height =
            item.height + "mm";


          const img =
            document.createElement(
              "img"
            );


          img.src =
            URL.createObjectURL(
              item.image.blob
            );


          box.appendChild(img);

          page.appendChild(box);


          /*
           * ドラッグ
           */

          setupDrag(
            box,
            item.image.id
          );


          /*
           * 長押し削除
           */

          setupLongPress(
            box,
            item.image.id
          );

        }
      );


      preview.appendChild(page);

    }
  );


  info.textContent =
    images.length +
    "枚 / " +
    pages.length +
    "ページ";

}


/* =====================================================
   ドラッグ＆ドロップ
===================================================== */

function setupDrag(
  element,
  id
) {

  element.addEventListener(
    "dragstart",
    function(event) {

      element.classList.add(
        "dragging"
      );


      event.dataTransfer.setData(
        "text/plain",
        String(id)
      );

    }
  );


  element.addEventListener(
    "dragend",
    function() {

      element.classList.remove(
        "dragging"
      );

      document
        .querySelectorAll(
          ".drag-over"
        )
        .forEach(
          function(el) {

            el.classList.remove(
              "drag-over"
            );

          }
        );

    }
  );


  element.addEventListener(
    "dragover",
    function(event) {

      event.preventDefault();

      element.classList.add(
        "drag-over"
      );

    }
  );


  element.addEventListener(
    "dragleave",
    function() {

      element.classList.remove(
        "drag-over"
      );

    }
  );


  element.addEventListener(
    "drop",
    async function(event) {

      event.preventDefault();

      element.classList.remove(
        "drag-over"
      );


      const fromId =
        Number(
          event.dataTransfer.getData(
            "text/plain"
          )
        );


      const toId =
        Number(id);


      if (
        fromId === toId
      ) {

        return;

      }


      /*
       * 現在位置
       */

      const fromIndex =
        images.findIndex(
          function(item) {

            return item.id === fromId;

          }
        );


      const toIndex =
        images.findIndex(
          function(item) {

            return item.id === toId;

          }
        );


      if (
        fromIndex === -1 ||
        toIndex === -1
      ) {

        return;

      }


      /*
       * 順番を入れ替える
       */

      const moved =
        images.splice(
          fromIndex,
          1
        )[0];


      images.splice(
        toIndex,
        0,
        moved
      );


      /*
       * 順番を保存
       */

      try {

        await saveOrder();


        saveStatus.textContent =
          "✓ 並び順を保存しました";


      } catch(error) {

        console.error(error);

      }


      /*
       * A4も再配置
       */

      await buildLayout();

    }
  );

}


/* =====================================================
   長押し削除
===================================================== */

function setupLongPress(
  element,
  id
) {

  let timer = null;

  let cancelled = false;


  function startPress() {

    cancelled = false;


    element.classList.add(
      "long-pressing"
    );


    timer =
      setTimeout(
        function() {

          if (cancelled) {

            return;

          }


          element.classList.remove(
            "long-pressing"
          );


          openDeleteModal(id);

        },
        650
      );

  }


  function endPress() {

    cancelled = true;


    if (
      timer !== null
    ) {

      clearTimeout(timer);

      timer = null;

    }


    element.classList.remove(
      "long-pressing"
    );

  }


  /*
   * PC
   */

  element.addEventListener(
    "mousedown",
    function(event) {

      if (
        event.button !== 0
      ) {

        return;

      }


      startPress();

    }
  );


  element.addEventListener(
    "mouseup",
    endPress
  );


  element.addEventListener(
    "mouseleave",
    endPress
  );


  /*
   * スマホ
   */

  element.addEventListener(
    "touchstart",
    function(event) {

      event.preventDefault();

      startPress();

    },
    {
      passive: false
    }
  );


  element.addEventListener(
    "touchend",
    endPress
  );


  element.addEventListener(
    "touchcancel",
    endPress
  );

}


/* =====================================================
   削除モーダル
===================================================== */

function openDeleteModal(
  id
) {

  pendingDeleteId =
    id;


  deleteModal.classList.add(
    "show"
  );

}


/* =====================================================
   モーダルを閉じる
===================================================== */

function closeDeleteModal() {

  pendingDeleteId =
    null;


  deleteModal.classList.remove(
    "show"
  );

}


/* =====================================================
   キャンセル
===================================================== */

cancelDelete.addEventListener(
  "click",
  function() {

    closeDeleteModal();

  }
);


/* =====================================================
   削除実行
===================================================== */

confirmDelete.addEventListener(
  "click",
  async function() {

    if (
      pendingDeleteId === null
    ) {

      return;

    }


    const id =
      pendingDeleteId;


    closeDeleteModal();


    try {

      await deleteImage(id);


      await loadImages();


      saveStatus.textContent =
        "✓ 画像を削除しました";


    } catch(error) {

      console.error(error);

      alert(
        "画像を削除できませんでした"
      );

    }

  }
);


/* =====================================================
   モーダル外側クリック
===================================================== */

deleteModal.addEventListener(
  "click",
  function(event) {

    if (
      event.target ===
      deleteModal
    ) {

      closeDeleteModal();

    }

  }
);


/* =====================================================
   設定変更
===================================================== */

heightInput.addEventListener(
  "change",
  buildLayout
);

gapInput.addEventListener(
  "change",
  buildLayout
);

marginInput.addEventListener(
  "change",
  buildLayout
);


/* =====================================================
   PDF
===================================================== */

pdfButton.addEventListener(
  "click",
  async function() {

    if (
      images.length === 0
    ) {

      alert(
        "先にスクショを追加してね！"
      );

      return;

    }


    await buildLayout();


    setTimeout(
      function() {

        window.print();

      },
      500
    );

  }
);


/* =====================================================
   全削除
===================================================== */

clearButton.addEventListener(
  "click",
  async function() {

    if (
      images.length === 0
    ) {

      return;

    }


    const answer =
      prompt(
        "全部削除する場合は「削除」と入力してください"
      );


    if (
      answer !== "削除"
    ) {

      return;

    }


    try {

      await clearDatabase();


      await loadImages();


      saveStatus.textContent =
        "✓ すべて削除しました";


    } catch(error) {

      console.error(error);

      alert(
        "削除できませんでした"
      );

    }

  }
);


/* =====================================================
   起動
===================================================== */

(async function() {

  try {

    await openDatabase();

    await loadImages();

  } catch(error) {

    console.error(error);

    saveStatus.textContent =
      "保存機能を開始できませんでした";

  }

})();
</script>
